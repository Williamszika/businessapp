name: Déployer la démo (GitHub Pages)

# Publie le dossier demo/ sur GitHub Pages.
# Une seule fois : Repo → Settings → Pages → "Build and deployment" → Source = "GitHub Actions".
# Ensuite, chaque push sur la branche par défaut met le lien à jour automatiquement.

on:
  push:
    branches: [main, master]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
