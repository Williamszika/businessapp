<title>ZKA — Application interactive</title>
<style>
  :root{
    --violet:#5A4BE0;--violet2:#7C5CEC;--violet3:#8B5CF6;--gold:#F5A623;
    --bg:#F4F5FB;--surface:#fff;--alt:#F1F2F9;--sunken:#ECEEF6;--border:#E8EAF3;
    --text:#141525;--t2:#585D73;--faint:#8B90A6;--onp:#fff;
    --success:#0F9F63;--successS:#E6F7EF;--warn:#B45309;--warnS:#FDF0DD;
    --danger:#E1362B;--dangerS:#FDEBE9;--info:#1E7FE8;--infoS:#E6F1FE;
    --primS:#ECEAFC;--goldS:#FEF3DC;--shadow:rgba(30,28,70,.14);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#0A0B12;--surface:#15171F;--alt:#1C1E29;--sunken:#101119;--border:#262A38;
    --text:#F3F4FA;--t2:#A7ACC2;--faint:#6B7189;
    --success:#2EC97D;--successS:#0F2A1E;--warn:#FDB022;--warnS:#2C2110;
    --danger:#F97066;--dangerS:#2C1614;--info:#53B1FD;--infoS:#0E2033;
    --primS:#211E3C;--goldS:#2C2413;--shadow:rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0A0B12;--surface:#15171F;--alt:#1C1E29;--sunken:#101119;--border:#262A38;
      --text:#F3F4FA;--t2:#A7ACC2;--faint:#6B7189;
      --success:#2EC97D;--successS:#0F2A1E;--warn:#FDB022;--warnS:#2C2110;
      --danger:#F97066;--dangerS:#2C1614;--info:#53B1FD;--infoS:#0E2033;
      --primS:#211E3C;--goldS:#2C2413;--shadow:rgba(0,0,0,.5);
    }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--sans);background:#0d0e15;color:var(--text);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:460px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 0 60px rgba(0,0,0,.4);}
  .content{flex:1;overflow-y:auto;overflow-x:hidden;}
  .content::-webkit-scrollbar{width:0;}
  .pad{padding:16px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .gap8{gap:8px;}.gap10{gap:10px;}.gap12{gap:12px;}
  .grow{flex:1;min-width:0;}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .center{text-align:center;}
  .mt4{margin-top:4px;}.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}
  .h1{font-size:26px;font-weight:800;letter-spacing:-.6px;}
  .h2{font-size:20px;font-weight:800;letter-spacing:-.3px;}
  .h3{font-size:17px;font-weight:700;}
  .t{font-size:15px;}
  .sm{font-size:13px;color:var(--t2);}
  .cap{font-size:11px;color:var(--faint);}
  .bold{font-weight:700;}
  .semi{font-weight:600;}
  .muted{color:var(--faint);}
  .sec{color:var(--t2);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;}
  .p14{padding:14px;}
  .list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;}
  .lrow+.lrow{border-top:1px solid var(--border);}
  .lrow:active{background:var(--alt);}
  .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;font-weight:700;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .btn{border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{opacity:.85;transform:scale(.99);}
  .btn-primary{background:var(--violet);color:#fff;}
  .btn-sec{background:var(--alt);color:var(--text);}
  .btn-out{background:transparent;color:var(--text);border:1.5px solid var(--border);}
  .full{width:100%;}
  .seg{display:flex;background:var(--sunken);border-radius:11px;padding:3px;gap:3px;}
  .seg button{flex:1;padding:8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--t2);}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px var(--shadow);}
  .chip{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--border);color:var(--t2);background:var(--surface);white-space:nowrap;}
  .chip.on{background:var(--violet);color:#fff;border-color:var(--violet);}
  .chip:active{opacity:.7;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .chips::-webkit-scrollbar{display:none;}
  .hero{border-radius:18px;padding:16px;background:linear-gradient(140deg,var(--violet2),var(--violet3) 70%,#A855F7);color:#fff;box-shadow:0 16px 30px -12px rgba(90,75,224,.6);}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:13px;flex:1;}
  .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;}
  .qa{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .qa:active{opacity:.7;}
  .qa .qi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;}
  .track{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;}
  .fill{height:100%;border-radius:999px;}
  .field{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px;min-height:50px;}
  .field input{flex:1;border:none;outline:none;background:none;color:var(--text);font-size:15px;padding:13px 0;}
  .field:focus-within{border-color:var(--violet);}
  .search{display:flex;align-items:center;gap:8px;background:var(--alt);border:1px solid var(--border);border-radius:12px;padding:0 14px;height:46px;}
  .search input{flex:1;border:none;outline:none;background:none;color:var(--text);font-size:15px;}
  .tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--faint);position:relative;}
  .tab.on{color:var(--violet);}
  .tab svg{width:24px;height:24px;}
  .tbadge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;}
  .hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;}
  .back{width:38px;height:38px;border-radius:50%;background:var(--alt);display:grid;place-items:center;flex:none;}
  .back:active{opacity:.6;}
  .fab{width:38px;height:38px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:24px;line-height:1;flex:none;}
  .fab:active{opacity:.8;}
  .bubble{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.35;}
  .b-them{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;align-self:flex-start;}
  .b-me{background:var(--violet);color:#fff;border-bottom-right-radius:5px;align-self:flex-end;}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px;gap:8px;}
  .empty .ec{width:70px;height:70px;border-radius:50%;background:var(--primS);display:grid;place-items:center;margin-bottom:8px;}
  .divider{height:1px;background:var(--border);}
  .toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:0 8px 24px var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .switch{width:46px;height:28px;border-radius:999px;background:var(--sunken);padding:3px;transition:.2s;}
  .switch.on{background:var(--violet);}
  .switch .knob{width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on .knob{transform:translateX(18px);}
  .grad-hero{padding:56px 24px 40px;background:linear-gradient(140deg,#6D5BF0,#8B5CF6 60%,#A855F7);color:#fff;border-bottom-left-radius:26px;border-bottom-right-radius:26px;}
</style>

<div id="app"></div>

 for(var d=days-1;d>=0;d--){var date=new Date(t0.getTime()-d*DAY);var we=date.getDay()===0||date.getDay()===6;var n=we?ri(3,6):ri(1,5);

 return out.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});}

/* ---------- Analytics ---------- */
function isPatron(){return S.user&&S.user.role==='patron';}
function scoped(){return isPatron()?S.sales:S.sales.filter(function(s){return s.employeeId===S.user.empId;});}
function sum(a){return a.reduce(function(s,x){return s+x.total;},0);}
function empById(id){for(var i=0;i<S.employees.length;i++)if(S.employees[i].id===id)return S.employees[i];return null;}
function prodById(id){for(var i=0;i<S.products.length;i++)if(S.products[i].id===id)return S.products[i];return null;}
function startOfDay(d){var c=new Date(d);c.setHours(0,0,0,0);return c;}
function salesToday(a){var s=startOfDay(new Date()).getTime(),e=s+DAY;return a.filter(function(x){var t=+new Date(x.createdAt);return t>=s&&t<e;});}
function seriesDaily(a,days){var today=startOfDay(new Date());var out=[],idx={};for(var i=days-1;i>=0;i--){var d=new Date(today.getTime()-i*DAY);out.push({label:''+d.getDate(),v:0});idx[startOfDay(d).getTime()]=out.length-1;}
 a.forEach(function(s){var t=startOfDay(new Date(s.createdAt)).getTime();if(idx[t]!==undefined)out[idx[t]].v+=s.total;});return out;}
function seriesMonthly(a,months){var base=new Date();base=new Date(base.getFullYear(),base.getMonth(),1);var out=[],idx={};for(var i=months-1;i>=0;i--){var m=new Date(base.getFullYear(),base.getMonth()-i,1);var k=m.getFullYear()+'-'+m.getMonth();out.push({label:MO[m.getMonth()],v:0});idx[k]=out.length-1;}
 a.forEach(function(s){var d=new Date(s.createdAt);var k=d.getFullYear()+'-'+d.getMonth();if(idx[k]!==undefined)out[idx[k]].v+=s.total;});return out;}
function inLast(a,days){var c=Date.now()-days*DAY;return a.filter(function(s){return +new Date(s.createdAt)>=c;});}
function byEmployee(a){var m={};a.forEach(function(s){(m[s.employeeId]=m[s.employeeId]||{c:0,r:0}).c++;m[s.employeeId].r+=s.total;});
 return S.employees.map(function(e){var g=m[e.id]||{c:0,r:0};return {emp:e,count:g.c,rev:g.r,comm:Math.round(g.r*e.comm)};}).sort(function(a,b){return b.rev-a.rev;});}
function lowStock(){return S.products.filter(function(p){return p.stock<=p.reorder;}).sort(function(a,b){return a.stock-b.stock;});}
function stockValue(){return S.products.reduce(function(s,p){return s+p.price*p.stock;},0);}
function margin(a){var c={};S.products.forEach(function(p){c[p.id]=p.cost;});var m=0;a.forEach(function(s){s.items.forEach(function(it){m+=(it.unitPrice-(c[it.productId]||0))*it.quantity;});});return m;}
function payBreak(a){var order=['espèces','mobile','carte','crédit'],m={};a.forEach(function(s){(m[s.pay]=m[s.pay]||{t:0,c:0}).t+=s.total;m[s.pay].c++;});
 return order.filter(function(k){return m[k];}).map(function(k){return {method:k,total:m[k].t,count:m[k].c};}).sort(function(a,b){return b.total-a.total;});}
function topProducts(a,lim){var m={};a.forEach(function(s){s.items.forEach(function(it){(m[it.productId]=m[it.productId]||{q:0,r:0}).q+=it.quantity;m[it.productId].r+=it.quantity*it.unitPrice;});});
 return Object.keys(m).map(function(id){return {p:prodById(id),q:m[id].q,r:m[id].r};}).filter(function(x){return x.p;}).sort(function(a,b){return b.r-a.r;}).slice(0,lim);}
function unreadCount(){return S.messages.filter(function(m){return !m.read&&m.senderId!==(S.user&&S.user.id)&&convVisible(m.conv);}).length;}
function convVisible(cid){var c=null;S.conversations.forEach(function(x){if(x.id===cid)c=x;});return c&&S.user&&c.parts.indexOf(S.user.id)>=0;}

/* ---------- Charts ---------- */
function lineChart(series,color){var W=300,H=150,pt=12,pb=12,ch=H-pt-pb;var max=Math.max(1);series.forEach(function(d){if(d.v>max)max=d.v;});
 var pts=series.map(function(d,i){return {x:series.length===1?W/2:i/(series.length-1)*W,y:pt+ch-(d.v/max)*ch};});
 function path(pp){if(pp.length<2)return '';var s='M '+pp[0].x+' '+pp[0].y;for(var i=0;i<pp.length-1;i++){var p0=pp[i-1]||pp[i],p1=pp[i],p2=pp[i+1],p3=pp[i+2]||p2;
  s+=' C '+(p1.x+(p2.x-p0.x)/6)+' '+(p1.y+(p2.y-p0.y)/6)+', '+(p2.x-(p3.x-p1.x)/6)+' '+(p2.y-(p3.y-p1.y)/6)+', '+p2.x+' '+p2.y;}return s;}
 var lp=path(pts);var ap=lp+' L '+pts[pts.length-1].x+' '+H+' L '+pts[0].x+' '+H+' Z';var last=pts[pts.length-1];
 var step=Math.max(1,Math.ceil(series.length/6));
 var labels='<div class="row" style="margin-top:8px">'+series.map(function(d,i){return '<div style="flex:1;text-align:center" class="cap">'+(i%step===0?d.label:'')+'</div>';}).join('')+'</div>';
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity="0.26"/><stop offset="1" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient></defs>'
 +'<path d="'+ap+'" fill="url(#ag)"/><path d="'+lp+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
 +'<circle cx="'+last.x+'" cy="'+last.y+'" r="6" fill="'+color+'" opacity="0.18"/><circle cx="'+last.x+'" cy="'+last.y+'" r="3.5" fill="'+color+'" stroke="var(--surface)" stroke-width="1.5"/></svg>'+labels;}
function donut(data,size){var th=18,r=(size-th)/2,cx=size/2,cy=size/2,C=2*Math.PI*r,off=0,tot=0;data.forEach(function(d){tot+=d.value;});tot=tot||1;
 var segs=data.map(function(d){var dash=d.value/tot*C;var el='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+th+'" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-off)+'"/>';off+=dash;return el;}).join('');
 return '<svg width="'+size+'" height="'+size+'"><g transform="rotate(-90 '+cx+' '+cy+')"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--sunken)" stroke-width="'+th+'"/>'+segs+'</g></svg>';}

 var sellers=byEmployee(per).filter(function(s){return s.rev>0;});var topRev=sellers[0]?sellers[0].rev:1;
 var pcol={'espèces':'var(--success)',mobile:'var(--info)',carte:'var(--violet)','crédit':'var(--warn)'};
 var pays=payBreak(per);var don=pays.map(function(p){return {label:p.method,value:p.total,color:pcol[p.method]};});
 var tops=topProducts(per,5);var maxP=tops[0]?tops[0].r:1;
 var h=backHeader('Revenus')+'<div class="pad" style="padding-top:0">';
 h+='<div class="seg mb16">'+[['7j','7 jours'],['30j','30 jours'],['6m','6 mois']].map(function(x){return '<button class="'+(r===x[0]?'on':'')+'" onclick="ZKA.setRevRange(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>';
 h+='<div class="hero mb16"><div class="row between"><div style="opacity:.9;font-size:13px;font-weight:600">Chiffre d’affaires</div><span class="badge" style="background:rgba(255,255,255,.2);color:#fff">'+svg(up?'up':'down',12,'#fff')+' '+pct(ratio,true)+'</span></div><div style="font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:2px">'+money(total)+'</div></div>';
 h+='<div class="card p14 mb16"><div class="h3">'+compact(chart.reduce(function(s,d){return s+d.v;},0))+'</div><div class="cap mb12">Total sur la période</div>'+lineChart(chart,'#5A4BE0')+'</div>';
 h+='<div class="row gap12 mb12">'+statCard('up','success','Marge brute',compact(mar))+statCard('receipt','primary','Ventes',fmtNum(cnt))+'</div><div class="row gap12 mb16">'+statCard('tag','info','Panier moyen',compact(avg))+statCard('wallet','accent','Marge %',total>0?pct(mar/total):'—')+'</div>';
 if(sellers.length){h+='<div class="h3 mb12">Par vendeur</div><div class="card p14 mb16">'+sellers.map(function(s,i){return '<div class="row gap12" '+(i?'style="margin-top:14px"':'')+'>'+avatar(s.emp.name,s.emp.emoji,38)+'<div class="grow"><div class="row between"><div class="semi ell">'+esc(s.emp.name)+'</div><div class="semi" style="font-size:13px">'+compact(s.rev)+'</div></div><div class="track mt8"><div class="fill" style="width:'+(s.rev/topRev*100)+'%;background:var(--violet)"></div></div><div class="cap mt4">'+s.count+' ventes • commission '+compact(s.comm)+'</div></div></div>';}).join('')+'</div>';}
 if(don.length){h+='<div class="h3 mb12">Moyens de paiement</div><div class="card p14 mb16 row gap12" style="align-items:center">'+donut(don,130)+'<div class="grow">'+pays.map(function(p){return '<div class="row gap8" style="margin-bottom:8px"><span class="dot" style="background:'+pcol[p.method]+';width:10px;height:10px"></span><div class="sm semi grow" style="text-transform:capitalize;color:var(--text)">'+p.method+'</div><div class="cap">'+pct(p.total/total)+'</div></div>';}).join('')+'</div></div>';}
 if(tops.length){h+='<div class="h3 mb12">Meilleurs produits</div><div class="card p14">'+tops.map(function(t,i){return '<div class="row gap12" '+(i?'style="margin-top:14px"':'')+'>'+avatar(t.p.name,t.p.emoji,38)+'<div class="grow"><div class="row between"><div class="semi ell">'+esc(t.p.name)+'</div><div class="semi" style="font-size:13px">'+compact(t.r)+'</div></div><div class="track mt8"><div class="fill" style="width:'+(t.r/maxP*100)+'%;background:var(--gold)"></div></div><div class="cap mt4">'+fmtNum(t.q)+' unités vendues</div></div></div>';}).join('')+'</div>';}
 h+='</div>';
 return h;
}

/* ---- Nouvelle vente ---- */
function viewNouvelleVente(){
 var q=S.venteFormQ?S.venteFormQ.toLowerCase():'';
 var prods=S.products.filter(function(p){return !q||(p.name+' '+p.cat).toLowerCase().indexOf(q)>=0;});
 var items=[];Object.keys(S.cart).forEach(function(id){var p=prodById(id);if(p)items.push({p:p,qty:S.cart[id]});});
 var total=items.reduce(function(s,x){return s+x.qty*x.p.price;},0);var count=items.reduce(function(s,x){return s+x.qty;},0);
 var sellers=S.employees.filter(function(e){return e.status==='actif';});
 var canSubmit=items.length>0&&S.vSeller;
 var h='<div style="display:flex;flex-direction:column;height:100%">';
 h+='<div class="hdr" style="border-bottom:1px solid var(--border)"><button class="back" onclick="ZKA.back()" aria-label="Fermer">'+svg('back',20)+'</button><div class="h3 grow">Nouvelle vente</div><button class="sm semi" style="color:var(--violet)" onclick="ZKA.back()">Fermer</button></div>';
 h+='<div style="flex:1;overflow-y:auto" class="pad">';
 if(isPatron()){h+='<div class="sm semi mb8">Vendeur</div><div class="chips mb16">'+sellers.map(function(e){return '<button class="chip '+(S.vSeller===e.id?'on':'')+'" onclick="ZKA.setSeller(\''+e.id+'\')">'+esc(e.name.split(' ')[0])+'</button>';}).join('')+'</div>';}
 h+='<div class="sm semi mb8">Produits</div><div class="search mb12">'+svg('search',18,'var(--faint)')+'<input id="vformSearch" value="'+esc(S.venteFormQ||'')+'" placeholder="Rechercher un produit…" oninput="ZKA.onSearch(\'venteFormQ\',this.value)"></div>';
 if(!prods.length)h+='<div class="card p14 mb16">'+empty('cube','Aucun produit','Rien ne correspond.')+'</div>';
 else h+='<div class="list mb16">'+prods.map(function(p){var qty=S.cart[p.id]||0;var atMax=qty>=p.stock;
  var ctrl=p.stock===0?tbadge('Rupture','danger'):qty===0?('<button onclick="ZKA.cart(\''+p.id+'\',1)" style="width:38px;height:38px;border-radius:50%;background:var(--primS);display:grid;place-items:center">'+svg('plus',20,'var(--violet)')+'</button>')
   :('<div class="row gap8"><button onclick="ZKA.cart(\''+p.id+'\',-1)" style="width:34px;height:34px;border-radius:50%;background:var(--alt);display:grid;place-items:center">'+svg('back',16)+'</button><div class="semi" style="min-width:22px;text-align:center">'+qty+'</div><button onclick="ZKA.cart(\''+p.id+'\',1)" '+(atMax?'disabled':'')+' style="width:34px;height:34px;border-radius:50%;background:'+(atMax?'var(--sunken)':'var(--violet)')+';display:grid;place-items:center">'+svg('plus',16,atMax?'var(--faint)':'#fff')+'</button></div>');
  return '<div class="lrow">'+avatar(p.name,p.emoji,40)+'<div class="grow"><div class="semi ell">'+esc(p.name)+'</div><div class="cap">'+money(p.price)+' • '+p.stock+' '+p.unit+'</div></div>'+ctrl+'</div>';}).join('')+'</div>';
 h+='<div class="sm semi mb8">Moyen de paiement</div><div class="seg mb16">'+['espèces','mobile','carte','crédit'].map(function(m){return '<button class="'+(S.vPay===m?'on':'')+'" onclick="ZKA.setPay(\''+m+'\')">'+cap(m)+'</button>';}).join('')+'</div>';
 h+='<div class="sm semi mb8">Client (optionnel)</div><div class="field mb16">'+svg('users',18,'var(--faint)')+'<input id="vcust" value="'+esc(S.vCust)+'" placeholder="Nom du client" oninput="ZKA.setCust(this.value)"></div>';
 h+='</div>';
 h+='<div style="padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)"><div class="row between mb8"><div class="sec">'+count+' article'+(count>1?'s':'')+'</div><div class="h2">'+money(total)+'</div></div>'
  +'<button class="btn full" onclick="ZKA.submitSale()" style="background:'+(canSubmit?'var(--violet)':'var(--sunken)')+';color:'+(canSubmit?'#fff':'var(--faint)')+'">Valider la vente</button></div>';
 h+='</div>';
 return h;
}

function viewProduitNew(){
 var f=S.pform;
 var h=backHeader('Nouveau produit')+'<div class="pad">';
 h+='<div class="sm semi mb8">Icône</div><div class="row" style="flex-wrap:wrap;gap:8px" class="mb16">'+['📦','🥤','🍚','🛢️','🧼','☕','🥛','🔌','🎧','👕','🧢','🍪'].map(function(e){return '<button onclick="ZKA.pf(\'emoji\',\''+e+'\')" style="width:46px;height:46px;border-radius:14px;font-size:22px;border:1.5px solid '+(f.emoji===e?'var(--violet)':'var(--border)')+';background:'+(f.emoji===e?'var(--primS)':'var(--surface)')+'">'+e+'</button>';}).join('')+'</div>';
 h+=field('Nom du produit','pname',f.name,'Ex. Riz parfumé 5kg')+field('Catégorie','pcat',f.cat,'Ex. Épicerie');
 h+='<div class="row gap12">'+field('Prix de vente','pprice',f.price,'0','numeric',1)+field('Coût d’achat','pcost',f.cost,'0','numeric',1)+'</div>';
 h+='<div class="row gap12">'+field('Stock initial','pstock',f.stock,'0','numeric',1)+field('Seuil d’alerte','preorder',f.reorder,'5','numeric',1)+'</div>';
 h+=field('Unité','punit',f.unit,'pièce');
 h+='<button class="btn btn-primary full mt16" onclick="ZKA.saveProduct()">Ajouter le produit</button></div>';
 return h;
}
function viewEmployeNew(){
 var f=S.eform;
 var h=backHeader('Nouvel employé')+'<div class="pad">';
 h+=field('Nom complet','ename',f.name,'Ex. Awa Traoré')+field('Poste','epos',f.pos,'Ex. Vendeuse')+field('Téléphone','ephone',f.phone,'+225 07 00 00 00');
 h+='<div class="row gap12">'+field('Salaire / mois','esal',f.sal,'0','numeric',1)+field('Commission %','ecom',f.com,'0','numeric',1)+'</div>';
 h+='<div class="sm semi mb8 mt8">Statut</div><div class="seg mb16">'+[['actif','Actif'],['conge','En congé'],['inactif','Inactif']].map(function(x){return '<button class="'+(f.status===x[0]?'on':'')+'" onclick="ZKA.ef(\'status\',\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>';
 h+='<button class="btn btn-primary full" onclick="ZKA.saveEmp()">Ajouter l’employé</button></div>';
 return h;
}
function field(label,id,val,ph,kind,inline){
 return '<div style="'+(inline?'flex:1;':'')+'margin-bottom:14px"><div class="sm semi mb8">'+label+'</div><div class="field"><input id="'+id+'" value="'+esc(val==null?'':val)+'" placeholder="'+ph+'"'+(kind==='numeric'?' inputmode="decimal"':'')+' oninput="ZKA.setField(\''+id+'\',this.value)"></div></div>';
}

function viewParametres(){
 var st=S.settings;
 var h=backHeader('Réglages')+'<div class="pad">';
 h+='<div class="card p14 row gap12 mb16">'+avatar(S.user.name,null,58)+'<div class="grow"><div class="h3 ell">'+esc(S.user.name)+'</div><div class="sm">'+esc(S.user.position||'Utilisateur')+'</div></div>'+tbadge(isPatron()?'Patron':'Employé',isPatron()?'primary':'info')+'</div>';
 if(isPatron()){h+='<div class="h3 mb12">Entreprise</div><div class="card p14 mb16"><div class="sm semi mb8">Nom de l’entreprise</div><div class="field"><input id="bname" value="'+esc(st.businessName)+'" oninput="ZKA.setBiz(this.value)"></div></div>';}
 h+='<div class="h3 mb12">Devise</div><div class="card p14 mb16"><div class="row" style="flex-wrap:wrap;gap:8px">'+['XOF','EUR','USD','MAD'].map(function(c){return '<button class="chip '+(st.currency===c?'on':'')+'" onclick="ZKA.setCurrency(\''+c+'\')">'+CUR[c].label+'</button>';}).join('')+'</div></div>';
 h+='<div class="h3 mb12">Préférences</div><div class="card p14 mb16"><div class="row between"><div class="row gap12">'+svg('alert',20,'var(--t2)')+'<div class="t">Thème sombre</div></div><button class="switch '+(theme()==='dark'?'on':'')+'" onclick="ZKA.toggleTheme()"><div class="knob"></div></button></div><div class="divider" style="margin:14px 0"></div><div class="row between"><div class="row gap12">'+svg('alert',20,'var(--t2)')+'<div class="t">Alertes de stock faible</div></div><button class="switch '+(st.lowAlerts?'on':'')+'" onclick="ZKA.toggle(\'lowAlerts\')"><div class="knob"></div></button></div></div>';
 h+='<div class="h3 mb12">Données & compte</div><button class="btn btn-sec full mb12" onclick="ZKA.reset()">'+svg('refresh',18)+' Réinitialiser la démonstration</button><button class="btn btn-out full" onclick="ZKA.logout()">'+svg('logout',18)+' Se déconnecter</button>';
 h+='<div class="center mt16"><div class="cap">ZKA • Gestion de commerce</div><div class="cap mt4">Version 1.0.0 — démo interactive</div></div>';
 h+='</div>';
 return h;
}

function empty(icon,title,msg){return '<div class="empty"><div class="ec">'+svg(icon,32,'var(--violet)')+'</div><div class="h3">'+title+'</div>'+(msg?'<div class="sec">'+msg+'</div>':'')+'</div>';}

/* ---------- Toast ---------- */
var toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},1800);}

/* ---------- Actions (global ZKA) ---------- */
window.ZKA={
 loginPatron:function(){S.user={id:'patron',name:'Direction ZKA',role:'patron',position:'Propriétaire'};S.route={name:'accueil'};S.prev=[];render();},
 loginEmp:function(id){var e=empById(id);S.user={id:e.id,name:e.name,role:'employe',empId:e.id,position:e.position};S.route={name:'accueil'};S.prev=[];render();},
 logout:function(){if(confirm('Se déconnecter de ZKA ?')){S.user=null;render();}},
 setTab:setTab,go:go,back:back,toggleTheme:toggleTheme,toast:toast,
 setRange:function(r){S.range=r;render();},
 setRevRange:function(r){S.revRange=r;render();},
 setSalesPeriod:function(p){S.salesPeriod=p;render();},
 setStockCat:function(c){S.stockCat=c;render();},
 setEquipeFilter:function(f){S.equipeFilter=f;render();},
 onSearch:function(key,val){var map={venteSearch:'venteQ',stockSearch:'stockQ',equipeSearch:'equipeQ',msgSearch:'msgQ',venteFormQ:'venteFormQ'};S[map[key]||key]=val;render();},
 newSale:function(){S.cart={};S.vCust='';S.venteFormQ='';if(!isPatron()&&S.user.empId)S.vSeller=S.user.empId;go('vente');},
 setSeller:function(id){S.vSeller=id;render();},
 setPay:function(m){S.vPay=m;render();},
 setCust:function(v){S.vCust=v;render();},
 cart:function(id,d){var p=prodById(id);var max=p?p.stock:0;var next=Math.min(max,Math.max(0,(S.cart[id]||0)+d));if(next===0)delete S.cart[id];else S.cart[id]=next;render();},
 submitSale:function(){var items=[];Object.keys(S.cart).forEach(function(id){var p=prodById(id);if(p)items.push({productId:id,name:p.name,quantity:S.cart[id],unitPrice:p.price});});
  if(!items.length||!S.vSeller){toast('Ajoutez au moins un produit');return;}
  var total=items.reduce(function(s,x){return s+x.quantity*x.unitPrice;},0);
  items.forEach(function(it){var p=prodById(it.productId);if(p)p.stock=Math.max(0,p.stock-it.quantity);});
  S.sales.unshift({id:'s'+Date.now(),ref:'ZKA-'+(SEQ++),employeeId:S.vSeller,items:items,total:total,pay:S.vPay,customer:S.vCust||null,createdAt:new Date().toISOString()});
  S.cart={};S.vCust='';back();toast('Vente enregistrée : '+money(total));},
 adjust:function(id,d){var p=prodById(id);if(p){p.stock=Math.max(0,p.stock+d);render();}},
 setStatus:function(id,st){var e=empById(id);if(e){e.status=st;render();}},
 messageEmp:function(id){if(id===S.user.id){setTab('messages');return;}var found=null;S.conversations.forEach(function(c){if(c.kind==='direct'&&c.parts.indexOf(S.user.id)>=0&&c.parts.indexOf(id)>=0)found=c;});
  if(!found){var e=empById(id);found={id:'c'+Date.now(),kind:'direct',title:e.name,parts:[S.user.id,id]};S.conversations.push(found);}go('chat',found.id);},
 setDraft:function(v){S.draft=v;var b=document.querySelector('#chatInput+button')||document.querySelector('[aria-label=Envoyer]');},
 send:function(cid){var t=S.draft.trim();if(!t)return;S.messages.push({id:'m'+Date.now(),conv:cid,senderId:S.user.id,senderName:S.user.name,text:t,createdAt:new Date().toISOString(),read:true});S.draft='';render();},
 setRevRange:function(r){S.revRange=r;render();},
 setCurrency:function(c){S.settings.currency=c;render();},
 setBiz:function(v){S.settings.businessName=v;},
 toggle:function(k){S.settings[k]=!S.settings[k];render();},
 reset:function(){if(confirm('Réinitialiser toutes les données de démonstration ?')){var u=S.user;var th=document.documentElement.getAttribute('data-theme');S=freshState();S.user=u;render();toast('Démonstration réinitialisée');}},
 setField:function(id,v){S._fields=S._fields||{};S._fields[id]=v;},
 pf:function(k,v){S.pform[k]=v;render();},
 ef:function(k,v){S.eform[k]=v;render();},
 saveProduct:function(){var f=S._fields||{};var name=(f.pname||'').trim();var price=parseFloat((f.pprice||'').replace(',','.'))||0;
  if(!name||price<=0){toast('Nom et prix requis');return;}
  S.products.push({id:'p'+Date.now(),name:name,sku:'ZKA-'+Math.floor(1000+Math.random()*9000),cat:(f.pcat||'Divers').trim()||'Divers',price:price,cost:parseFloat((f.pcost||'').replace(',','.'))||0,stock:Math.round(parseFloat(f.pstock||'0'))||0,reorder:Math.round(parseFloat(f.preorder||'5'))||5,unit:(f.punit||'pièce').trim()||'pièce',emoji:S.pform.emoji});
  S._fields={};back();toast('Produit ajouté : '+name);},
 saveEmp:function(){var f=S._fields||{};var name=(f.ename||'').trim(),pos=(f.epos||'').trim(),phone=(f.ephone||'').trim();
  if(!name||!pos||!phone){toast('Nom, poste et téléphone requis');return;}
  S.employees.push({id:'e'+Date.now(),name:name,position:pos,phone:phone,status:S.eform.status,salary:Math.round(parseFloat(f.esal||'0'))||0,comm:(parseFloat((f.ecom||'0').replace(',','.'))||0)/100,emoji:'🧑🏾‍💼'});
  S._fields={};back();toast('Employé ajouté : '+name);}
};
// init forms
S.pform={emoji:'📦',name:'',cat:'',price:'',cost:'',stock:'',reorder:'',unit:'pièce'};
S.eform={status:'actif'};
// override go for form screens to reset form state
var _go=go;
window.ZKA.go=function(name,id){if(name==='produitNew'){S.pform={emoji:'📦'};S._fields={};}if(name==='employeNew'){S.eform={status:'actif'};S._fields={};}_go(name,id);};

render();
})();
</script>
