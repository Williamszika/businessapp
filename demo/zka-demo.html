<title>ZKA — Application interactive</title>
<style>
  :root{
    --violet:#5A4BE0;--violet2:#7C5CEC;--violet3:#8B5CF6;--gold:#F5A623;
    --bg:#F4F5FB;--surface:#fff;--alt:#F1F2F9;--sunken:#ECEEF6;--border:#E8EAF3;
    --text:#141525;--t2:#585D73;--faint:#8B90A6;--onp:#fff;
    --success:#0F9F63;--successS:#E6F7EF;--warn:#B45309;--warnS:#FDF0DD;
    --danger:#E1362B;--dangerS:#FDEBE9;--info:#1E7FE8;--infoS:#E6F1FE;
    --primS:#ECEAFC;--goldS:#FEF3DC;--shadow:rgba(30,28,70,.14);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  :root[data-theme="dark"]{--bg:#0A0B12;--surface:#15171F;--alt:#1C1E29;--sunken:#101119;--border:#262A38;--text:#F3F4FA;--t2:#A7ACC2;--faint:#6B7189;--success:#2EC97D;--successS:#0F2A1E;--warn:#FDB022;--warnS:#2C2110;--danger:#F97066;--dangerS:#2C1614;--info:#53B1FD;--infoS:#0E2033;--primS:#211E3C;--goldS:#2C2413;--shadow:rgba(0,0,0,.5);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0B12;--surface:#15171F;--alt:#1C1E29;--sunken:#101119;--border:#262A38;--text:#F3F4FA;--t2:#A7ACC2;--faint:#6B7189;--success:#2EC97D;--successS:#0F2A1E;--warn:#FDB022;--warnS:#2C2110;--danger:#F97066;--dangerS:#2C1614;--info:#53B1FD;--infoS:#0E2033;--primS:#211E3C;--goldS:#2C2413;--shadow:rgba(0,0,0,.5);}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--sans);background:#0d0e15;color:var(--text);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:460px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 0 60px rgba(0,0,0,.4);}
  .content{flex:1;overflow-y:auto;overflow-x:hidden;}
  .content::-webkit-scrollbar{width:0;}
  .pad{padding:16px;}
  .row{display:flex;align-items:center;}.between{justify-content:space-between;}
  .gap8{gap:8px;}.gap10{gap:10px;}.gap12{gap:12px;}
  .grow{flex:1;min-width:0;}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.center{text-align:center;}
  .mt4{margin-top:4px;}.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}
  .h1{font-size:26px;font-weight:800;letter-spacing:-.6px;}.h2{font-size:20px;font-weight:800;letter-spacing:-.3px;}.h3{font-size:17px;font-weight:700;}
  .t{font-size:15px;}.sm{font-size:13px;color:var(--t2);}.cap{font-size:11px;color:var(--faint);}
  .bold{font-weight:700;}.semi{font-weight:600;}.muted{color:var(--faint);}.sec{color:var(--t2);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;}
  .p14{padding:14px;}
  .list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;}
  .lrow+.lrow{border-top:1px solid var(--border);}.lrow:active{background:var(--alt);}
  .av{border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .btn{border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{opacity:.85;transform:scale(.99);}
  .btn-primary{background:var(--violet);color:#fff;}.btn-sec{background:var(--alt);color:var(--text);}
  .btn-out{background:transparent;color:var(--text);border:1.5px solid var(--border);}
  .btn-danger{background:var(--dangerS);color:var(--danger);}
  .full{width:100%;}
  .seg{display:flex;background:var(--sunken);border-radius:11px;padding:3px;gap:3px;}
  .seg button{flex:1;padding:8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--t2);}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px var(--shadow);}
  .chip{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--border);color:var(--t2);background:var(--surface);white-space:nowrap;}
  .chip.on{background:var(--violet);color:#fff;border-color:var(--violet);}.chip:active{opacity:.7;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}.chips::-webkit-scrollbar{display:none;}
  .hero{border-radius:18px;padding:16px;background:linear-gradient(140deg,var(--violet2),var(--violet3) 70%,#A855F7);color:#fff;box-shadow:0 16px 30px -12px rgba(90,75,224,.6);}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:13px;flex:1;}
  .ico{border-radius:10px;display:grid;place-items:center;}
  .qa{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .qa:active{opacity:.7;}.qa .qi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;}
  .track{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;}.fill{height:100%;border-radius:999px;}
  .field{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px;min-height:50px;}
  .field input,.field select{flex:1;border:none;outline:none;background:none;color:var(--text);font-size:15px;padding:13px 0;}
  .field:focus-within{border-color:var(--violet);}
  .search{display:flex;align-items:center;gap:8px;background:var(--alt);border:1px solid var(--border);border-radius:12px;padding:0 14px;height:46px;}
  .search input{flex:1;border:none;outline:none;background:none;color:var(--text);font-size:15px;}
  .tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--faint);position:relative;}
  .tab.on{color:var(--violet);}.tab svg{width:24px;height:24px;}
  .tbadge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;}
  .hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;}
  .back{width:38px;height:38px;border-radius:50%;background:var(--alt);display:grid;place-items:center;flex:none;}.back:active{opacity:.6;}
  .fab{width:38px;height:38px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;flex:none;}.fab:active{opacity:.8;}
  .bubble{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.35;}
  .b-them{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;align-self:flex-start;}
  .b-me{background:var(--violet);color:#fff;border-bottom-right-radius:5px;align-self:flex-end;}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 24px;gap:8px;}
  .empty .ec{width:70px;height:70px;border-radius:50%;background:var(--primS);display:grid;place-items:center;margin-bottom:8px;}
  .divider{height:1px;background:var(--border);}
  .toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:0 8px 24px var(--shadow);max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .switch{width:46px;height:28px;border-radius:999px;background:var(--sunken);padding:3px;transition:.2s;}
  .switch.on{background:var(--violet);}.switch .knob{width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on .knob{transform:translateX(18px);}
  .grad-hero{padding:52px 24px 36px;background:linear-gradient(140deg,#6D5BF0,#8B5CF6 60%,#A855F7);color:#fff;border-bottom-left-radius:26px;border-bottom-right-radius:26px;}
  .recu{background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--border);}
  .recu-top{background:linear-gradient(135deg,var(--violet2),var(--violet3));color:#fff;padding:18px;text-align:center;}
  .recu .qrbox{display:flex;justify-content:center;padding:14px;}
  .qrframe{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--border);display:inline-block;}
  .kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;}
  .kv .k{color:var(--t2);}.kv .v{font-weight:600;}
</style>

<script>/* Générateur de QR code autonome — mode octet, niveau L, versions 1..4 (bloc unique).
   Suffisant pour des identifiants courts. Renvoie {size, dark(r,c)}. */
var QR = (function () {
  var EXP = new Array(256), LOG = new Array(256);
  (function () { var x = 1; for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (var i = 255; i < 256; i++) EXP[i] = EXP[i - 255]; })();
  function gmul(a, b) { if (a === 0 || b === 0) return 0; return EXP[(LOG[a] + LOG[b]) % 255]; }
  function multPoly(a, b) { var r = new Array(a.length + b.length - 1); for (var i = 0; i < r.length; i++) r[i] = 0; for (var i = 0; i < a.length; i++) for (var j = 0; j < b.length; j++) r[i + j] ^= gmul(a[i], b[j]); return r; }
  function genPoly(n) { var p = [1]; for (var i = 0; i < n; i++) p = multPoly(p, [1, EXP[i]]); return p; }
  function ecc(data, ecLen) { var gen = genPoly(ecLen); var msg = data.concat(new Array(ecLen).fill(0)); for (var i = 0; i < data.length; i++) { var c = msg[i]; if (c) for (var j = 0; j < gen.length; j++) msg[i + j] ^= gmul(gen[j], c); } return msg.slice(data.length); }

  var CAP = [19, 34, 55, 80], ECL = [7, 10, 15, 20], MAXC = [17, 32, 53, 78];
  function encode(str) {
    var ver = 0; for (var i = 0; i < 4; i++) { if (str.length <= MAXC[i]) { ver = i + 1; break; } }
    if (!ver) throw new Error('QR: chaîne trop longue');
    var dataCw = CAP[ver - 1], ecLen = ECL[ver - 1], bits = [];
    function push(v, len) { for (var i = len - 1; i >= 0; i--) bits.push((v >> i) & 1); }
    push(0x4, 4); push(str.length, 8);
    for (var i = 0; i < str.length; i++) push(str.charCodeAt(i) & 0xff, 8);
    push(0, 4);
    while (bits.length % 8 !== 0) bits.push(0);
    var bytes = []; for (var i = 0; i < bits.length; i += 8) { var b = 0; for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; bytes.push(b); }
    var pad = [0xEC, 0x11], pi = 0; while (bytes.length < dataCw) { bytes.push(pad[pi & 1]); pi++; }
    return { version: ver, codewords: bytes.concat(ecc(bytes, ecLen)) };
  }

  function buildMatrix(ver, codewords) {
    var size = ver * 4 + 17, m = [], reserved = [];
    for (var r = 0; r < size; r++) { m.push(new Array(size).fill(null)); reserved.push(new Array(size).fill(false)); }
    function setF(r, c, v) { if (r < 0 || c < 0 || r >= size || c >= size) return; m[r][c] = v; reserved[r][c] = true; }
    function finder(r0, c0) { for (var r = -1; r <= 7; r++) for (var c = -1; c <= 7; c++) { var rr = r0 + r, cc = c0 + c; if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue; var inb = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) || (r >= 2 && r <= 4 && c >= 2 && c <= 4); setF(rr, cc, inb ? 1 : 0); } }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
    for (var i = 8; i < size - 8; i++) { var v = i % 2 === 0 ? 1 : 0; if (!reserved[6][i]) setF(6, i, v); if (!reserved[i][6]) setF(i, 6, v); }
    if (ver >= 2) { var ac = size - 7; for (var r = -2; r <= 2; r++) for (var c = -2; c <= 2; c++) { var inb = Math.max(Math.abs(r), Math.abs(c)) === 2 || (r === 0 && c === 0) ? 1 : 0; setF(ac + r, ac + c, inb); } }
    setF(size - 8, 8, 1);
    for (var i = 0; i <= 8; i++) { reserved[8][i] = true; reserved[i][8] = true; }
    for (var i = 0; i < 8; i++) { reserved[8][size - 1 - i] = true; reserved[size - 1 - i][8] = true; }
    var bitstream = []; for (var k = 0; k < codewords.length; k++) for (var b = 7; b >= 0; b--) bitstream.push((codewords[k] >> b) & 1);
    var bi = 0;
    for (var right = size - 1; right >= 1; right -= 2) { if (right === 6) right = 5; for (var vert = 0; vert < size; vert++) for (var j = 0; j < 2; j++) { var x = right - j; var up = ((right + 1) & 2) === 0; var y = up ? size - 1 - vert : vert; if (!reserved[y][x]) { m[y][x] = bi < bitstream.length ? bitstream[bi] : 0; bi++; } } }
    return { m: m, reserved: reserved, size: size };
  }

  function maskCond(k, r, c) {
    switch (k) {
      case 0: return (r + c) % 2 === 0; case 1: return r % 2 === 0; case 2: return c % 3 === 0; case 3: return (r + c) % 3 === 0;

  function penalty(m, size) {
    function d(r, c) { return m[r][c] ? 1 : 0; } var p = 0, r, c, i;
    for (r = 0; r < size; r++) { var run = 1; for (c = 1; c < size; c++) { if (d(r, c) === d(r, c - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p += 1; } else run = 1; } }
    for (c = 0; c < size; c++) { var run = 1; for (r = 1; r < size; r++) { if (d(r, c) === d(r - 1, c)) { run++; if (run === 5) p += 3; else if (run > 5) p += 1; } else run = 1; } }
    for (r = 0; r < size - 1; r++) for (c = 0; c < size - 1; c++) { var v = d(r, c); if (v === d(r, c + 1) && v === d(r + 1, c) && v === d(r + 1, c + 1)) p += 3; }
    var pat = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 0];
    function match(r, c, dr, dc) { for (i = 0; i < 11; i++) { var rr = r + dr * i, cc = c + dc * i; if (rr < 0 || cc < 0 || rr >= size || cc >= size) return false; if (d(rr, cc) !== pat[i]) return false; } return true; }
    for (r = 0; r < size; r++) for (c = 0; c < size; c++) { if (match(r, c, 0, 1)) p += 40; if (match(r, c, 1, 0)) p += 40; }
    var dark = 0; for (r = 0; r < size; r++) for (c = 0; c < size; c++) dark += d(r, c);
    var ratio = dark / (size * size) * 100; p += Math.floor(Math.abs(ratio - 50) / 5) * 10;
    return p;
  }
  function fmtBits(mask) { var data = (1 << 3) | mask; var rem = data; for (var i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >>> 9) & 1) * 0x537); var v = (((data << 10) | rem) ^ 0x5412) & 0x7fff; var r = 0; for (var i = 0; i < 15; i++) r |= ((v >> i) & 1) << (14 - i); return r; }
  function placeFormat(m, size, fmt) {
    function bit(i) { return (fmt >> i) & 1; }
    for (var i = 0; i <= 5; i++) m[8][i] = bit(i);
    m[8][7] = bit(6); m[8][8] = bit(7); m[7][8] = bit(8);
    for (var i = 9; i <= 14; i++) m[14 - i][8] = bit(i);
    for (var i = 0; i <= 7; i++) m[size - 1 - i][8] = bit(i);
    for (var i = 8; i <= 14; i++) m[8][size - 15 + i] = bit(i);
    m[size - 8][8] = 1;
  }
  return {
    build: function (str, forceMask) {
      var enc = encode(str), bm = buildMatrix(enc.version, enc.codewords);
      var best = 0, bp = Infinity, bm2 = null;
      if (forceMask != null) { best = forceMask; bm2 = applyMask(bm, best); }
      else { for (var k = 0; k < 8; k++) { var mm = applyMask(bm, k); var p = penalty(mm, bm.size); if (p < bp) { bp = p; best = k; bm2 = mm; } } }
      placeFormat(bm2, bm.size, fmtBits(best));
      return { size: bm.size, mask: best, codewords: enc.codewords, dark: function (r, c) { return bm2[r][c] === 1; } };
    }
  };
})();

</script>

/* ---------- Analytics ---------- */
function startOfDay(d){var c=new Date(d);c.setHours(0,0,0,0);return c;}
function sum(a){return a.reduce(function(s,x){return s+x.total;},0);}
function salesToday(a){var s=+startOfDay(new Date()),e=s+DAY;return a.filter(function(x){var t=+new Date(x.createdAt);return t>=s&&t<e;});}
function inLast(a,days){var c=Date.now()-days*DAY;return a.filter(function(s){return +new Date(s.createdAt)>=c;});}
function seriesDaily(a,days){var today=startOfDay(new Date()),out=[],idx={};for(var i=days-1;i>=0;i--){var d=new Date(today.getTime()-i*DAY);out.push({label:''+d.getDate(),v:0});idx[+startOfDay(d)]=out.length-1;}a.forEach(function(s){var t=+startOfDay(new Date(s.createdAt));if(idx[t]!==undefined)out[idx[t]].v+=s.total;});return out;}
function seriesMonthly(a,months){var base=new Date();base=new Date(base.getFullYear(),base.getMonth(),1);var out=[],idx={};for(var i=months-1;i>=0;i--){var m=new Date(base.getFullYear(),base.getMonth()-i,1),k=m.getFullYear()+'-'+m.getMonth();out.push({label:MO[m.getMonth()],v:0});idx[k]=out.length-1;}a.forEach(function(s){var d=new Date(s.createdAt),k=d.getFullYear()+'-'+d.getMonth();if(idx[k]!==undefined)out[idx[k]].v+=s.total;});return out;}
function margin(a){var c={};S.products.forEach(function(p){c[p.id]=p.cost;});var m=0;a.forEach(function(s){s.items.forEach(function(it){m+=(it.unitPrice-(c[it.productId]||0))*it.quantity;});});return m;}
function rankCommerciaux(list){return list.map(function(c){var sl=salesOf(c.id),r=sum(sl);return {c:c,count:sl.length,rev:r,comm:Math.round(r*(c.comm||0))};}).sort(function(a,b){return b.rev-a.rev;});}

function lineChart(series,color){var W=300,H=140,pt=12,pb=12,ch=H-pt-pb,max=1;series.forEach(function(d){if(d.v>max)max=d.v;});var pts=series.map(function(d,i){return {x:series.length===1?W/2:i/(series.length-1)*W,y:pt+ch-d.v/max*ch};});
 function path(pp){if(pp.length<2)return '';var s='M '+pp[0].x+' '+pp[0].y;for(var i=0;i<pp.length-1;i++){var p0=pp[i-1]||pp[i],p1=pp[i],p2=pp[i+1],p3=pp[i+2]||p2;s+=' C '+(p1.x+(p2.x-p0.x)/6)+' '+(p1.y+(p2.y-p0.y)/6)+', '+(p2.x-(p3.x-p1.x)/6)+' '+(p2.y-(p3.y-p1.y)/6)+', '+p2.x+' '+p2.y;}return s;}
 var lp=path(pts),ap=lp+' L '+pts[pts.length-1].x+' '+H+' L '+pts[0].x+' '+H+' Z',last=pts[pts.length-1],step=Math.max(1,Math.ceil(series.length/6));
 var labels='<div class="row" style="margin-top:8px">'+series.map(function(d,i){return '<div style="flex:1;text-align:center" class="cap">'+(i%step===0?d.label:'')+'</div>';}).join('')+'</div>';
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity="0.26"/><stop offset="1" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient></defs><path d="'+ap+'" fill="url(#ag)"/><path d="'+lp+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last.x+'" cy="'+last.y+'" r="3.5" fill="'+color+'" stroke="var(--surface)" stroke-width="1.5"/></svg>'+labels;}
function donut(data,size){var th=18,r=(size-th)/2,cx=size/2,cy=size/2,C=2*Math.PI*r,off=0,tot=0;data.forEach(function(d){tot+=d.value;});tot=tot||1;var segs=data.map(function(d){var dash=d.value/tot*C,el='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+th+'" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-off)+'"/>';off+=dash;return el;}).join('');return '<svg width="'+size+'" height="'+size+'"><g transform="rotate(-90 '+cx+' '+cy+')"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--sunken)" stroke-width="'+th+'"/>'+segs+'</g></svg>';}

 h+='<div class="h3 mb12">Préférences</div><div class="card p14 mb16"><div class="row between"><div class="row gap12">'+svg('moon',20,'var(--t2)')+'<div class="t">Thème sombre</div></div><button class="switch '+(theme()==='dark'?'on':'')+'" onclick="ZKA.toggleTheme()"><div class="knob"></div></button></div></div>';

 h+='<button class="btn btn-out full" onclick="ZKA.logout()">'+svg('logout',18)+' Se déconnecter</button>';
 h+='<div class="center mt16"><div class="cap">ZKA • Gestion de commerce</div><div class="cap mt4">Démo interactive · v2 rôles</div></div>';
 return h+'</div>';
}

/* ---------- Toast ---------- */
var toastT;function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},2000);}

/* ---------- Actions ---------- */
window.ZKA={
 login:function(){var a=byLogin((S.loginId||'').trim().toLowerCase());if(!a||a.pin!==(S.loginPin||'').trim()){S.loginErr='Identifiant ou code incorrect.';render();return;}if(a.status==='bloque'){S.loginErr='Ce compte est bloqué. Contactez la direction.';render();return;}S.user=a;S.loginErr='';S.loginId='';S.loginPin='';S.route={name:'accueil'};S.prev=[];render();},
 quick:function(login){S.loginId=login;S.loginPin='1234';this.login();},
 toggleDemo:function(){S.showDemo=!S.showDemo;render();},
 logout:function(){if(confirm('Se déconnecter ?')){S.user=null;S.route={name:'accueil'};render();}},
 setTab:setTab,go:go,back:back,toggleTheme:toggleTheme,toast:toast,
 onSearch:function(key,val){var map={venteSearch:'venteQ',stockSearch:'stockQ',equipeSearch:'equipeQ',msgSearch:'msgQ',venteFormQ:'venteFormQ',loginId:'loginId',loginPin:'loginPin'};S[map[key]||key]=val;render();},
 setRange:function(r){S.range=r;render();},setSalesPeriod:function(p){S.salesPeriod=p;render();},setStockCat:function(c){S.stockCat=c;render();},
 newSale:function(){if(role()!=='commercial'){toast('Seuls les commerciaux enregistrent des ventes');return;}S.cart={};S.vCust='';S.venteFormQ='';S.vPay='espèces';go('vente');},
 setPay:function(m){S.vPay=m;render();},setCust:function(v){S.vCust=v;render();},
 cart:function(id,d){var p=prodById(id);var max=p?p.stock:0;var next=Math.min(max,Math.max(0,(S.cart[id]||0)+d));if(next===0)delete S.cart[id];else S.cart[id]=next;render();},
 submitSale:function(){var items=[];Object.keys(S.cart).forEach(function(id){var p=prodById(id);if(p)items.push({productId:id,name:p.name,quantity:S.cart[id],unitPrice:p.price});});if(!items.length){toast('Ajoutez au moins un produit');return;}var total=items.reduce(function(s,x){return s+x.quantity*x.unitPrice;},0);var units=items.reduce(function(s,x){return s+x.quantity;},0);items.forEach(function(it){var p=prodById(it.productId);if(p)p.stock=Math.max(0,p.stock-it.quantity);});S.user.carried=Math.max(0,carriedOf(S.user)-units);var sale={id:'s'+Date.now(),ref:'ZKA-'+(SEQ++),sellerId:S.user.id,items:items,total:total,pay:S.vPay,customer:S.vCust||null,createdAt:new Date().toISOString()};S.sales.unshift(sale);S.cart={};S.vCust='';S.prev=[{name:'ventes'}];S.route={name:'recu',id:sale.id};render();scrollTop();toast('Vente enregistrée : '+money(total));},
 adjust:function(id,d){var p=prodById(id);if(p){p.stock=Math.max(0,p.stock+d);render();}},
 replenish:function(id,n){var a=acct(id);if(a){a.carried=carriedOf(a)+n;toast(a.name.split(' ')[0]+' réapprovisionné (+'+n+' u.)');render();}},
 contact:function(id){var found=null;S.conversations.forEach(function(c){if(c.kind==='direct'&&c.parts.indexOf(S.user.id)>=0&&c.parts.indexOf(id)>=0)found=c;});if(!found){found={id:'c'+Date.now(),kind:'direct',parts:[S.user.id,id]};S.conversations.push(found);}go('chat',found.id);},
 setDraft:function(v){S.draft=v;},
 send:function(cid){var t=S.draft.trim();if(!t)return;S.messages.push({id:'m'+Date.now(),conv:cid,senderId:S.user.id,text:t,createdAt:new Date().toISOString(),read:true});S.draft='';render();},
 setCurrency:function(c){S.settings.currency=c;render();},
 setField:function(id,v){S._f[id]=v;},
 pf:function(k,v){S.pform[k]=v;render();},
 af:function(k,v){S.aform[k]=v;render();},
 saveProduct:function(){var f=S._f,name=(f.pname||'').trim(),price=parseFloat((f.pprice||'').replace(',','.'))||0;if(!name||price<=0){toast('Nom et prix requis');return;}S.products.push({id:'p'+Date.now(),name:name,sku:'ZKA-'+Math.floor(1000+Math.random()*9000),cat:(f.pcat||'Divers').trim()||'Divers',price:price,cost:parseFloat((f.pcost||'').replace(',','.'))||0,stock:Math.round(parseFloat(f.pstock||'0'))||0,reorder:Math.round(parseFloat(f.preorder||'5'))||5,unit:(f.punit||'pièce').trim()||'pièce',emoji:S.pform.emoji});S._f={};back();toast('Produit ajouté : '+name);},
 block:function(id){var a=acct(id);if(!a)return;a.status=a.status==='bloque'?'actif':'bloque';toast(a.name+(a.status==='bloque'?' bloqué':' débloqué'));render();},
 del:function(id){var a=acct(id);if(!a)return;if(confirm('Supprimer le compte de '+a.name+' ?')){S.accounts=S.accounts.filter(function(x){return x.id!==id;});toast('Compte supprimé');render();}},
 saveAccount:function(){var f=S.aform,ff=S._f,name=(ff.aname||'').trim(),login=(ff.alogin||'').trim().toLowerCase(),pin=(ff.apin||'').trim();
  if(!name||!login||!pin){toast('Nom, identifiant et code requis');return;}if(byLogin(login)){toast('Cet identifiant existe déjà');return;}
  var em=f.role==='responsable'?'🧑🏾‍💼':'🧑🏾‍💻';var a={id:(f.role==='responsable'?'resp':'com')+Date.now(),role:f.role,name:name,login:login,pin:pin,status:'actif',emoji:em};if(f.role==='commercial'){a.mgr=f.mgr||responsables()[0].id;a.comm=0.03;}else a.phone='';
  S.accounts.push(a);S._f={};S.aform={role:'commercial',mgr:responsables()[0].id};S.prev=[{name:'comptes'}];S.route={name:'badge',id:a.id};render();scrollTop();toast('Compte créé : @'+login);},
 reset:function(){if(confirm('Réinitialiser toutes les données ?')){var u=S.user;S=freshState();S.user=byLogin(u.login)||null;if(!S.user){S.user=null;}render();toast('Démonstration réinitialisée');}}
};
S.pform={emoji:'📦'};
var _go=go;window.ZKA.go=function(name,id){if(name==='produitNew'){S.pform={emoji:'📦'};S._f={};}if(name==='compteNew'){S.aform={role:'commercial',mgr:responsables()[0].id};S._f={};}_go(name,id);};
render();
})();
</script>
