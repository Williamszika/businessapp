<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5A4BE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZKA">
<title>ZKA — Gestion de commerce</title>
<!-- ZKA build: 2026-07-09d (organigramme Équipe + fiche membre ancienneté/CA) -->
<style>
  :root{--violet:#5A4BE0;--violet2:#7C5CEC;--violet3:#8B5CF6;--gold:#F5A623;
    --bg:#F4F5FB;--surface:#fff;--alt:#F1F2F9;--sunken:#ECEEF6;--border:#E8EAF3;
    --text:#141525;--t2:#585D73;--faint:#8B90A6;
    --success:#0F9F63;--successS:#E6F7EF;--warn:#B45309;--warnS:#FDF0DD;--danger:#E1362B;--dangerS:#FDEBE9;--info:#1E7FE8;--infoS:#E6F1FE;--primS:#ECEAFC;--goldS:#FEF3DC;--shadow:rgba(30,28,70,.12);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  @media (prefers-color-scheme:dark){:root{--bg:#0A0B12;--surface:#15171F;--alt:#1C1E29;--sunken:#101119;--border:#262A38;--text:#F3F4FA;--t2:#A7ACC2;--faint:#6B7189;--success:#2EC97D;--successS:#0F2A1E;--warn:#FDB022;--warnS:#2C2110;--danger:#F97066;--dangerS:#2C1614;--info:#53B1FD;--infoS:#0E2033;--primS:#211E3C;--goldS:#2C2413;--shadow:rgba(0,0,0,.5);}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text)}
  #app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
  .content{flex:1;overflow-y:auto;padding:16px;padding-bottom:24px}
  .h1{font-size:25px;font-weight:800;letter-spacing:-.6px}.h2{font-size:19px;font-weight:800;letter-spacing:-.3px}.h3{font-size:16px;font-weight:700}
  .sm{font-size:13px;color:var(--t2)}.cap{font-size:11px;color:var(--faint)}.bold{font-weight:700}.semi{font-weight:600}.mut{margin-top:8px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin:0 0 6px}
  input,select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;padding:12px 13px;outline:none}
  input:focus,select:focus{border-color:var(--violet)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:700;font-size:15px;padding:13px 15px;background:var(--violet);color:#fff}
  button.sec{background:var(--alt);color:var(--text)}button.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
  button:active{opacity:.85}button:disabled{opacity:.45}
  .full{width:100%}
  .row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.center{text-align:center}
  .hero{border-radius:18px;padding:18px;background:linear-gradient(140deg,var(--violet2),var(--violet3) 70%,#A855F7);color:#fff;box-shadow:0 16px 30px -14px rgba(90,75,224,.6);margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:12px;flex:1;min-width:0}
  .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .ok{background:var(--successS);color:var(--success)}.warn{background:var(--warnS);color:var(--warn)}.dg{background:var(--dangerS);color:var(--danger)}.inf{background:var(--infoS);color:var(--info)}.neu{background:var(--alt);color:var(--t2)}.acc{background:var(--goldS);color:var(--warn)}.pri{background:var(--primS);color:var(--violet)}
  .lrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border)}.lrow:first-child{border-top:none}
  .av{border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:#fff}
  .stepper{display:flex;align-items:center;gap:8px}
  .rbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;padding:0;flex:none}
  .track{height:7px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:6px}.fill{height:100%;border-radius:999px;background:var(--violet)}
  .chip{display:inline-block;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid var(--border);color:var(--t2);background:var(--surface);white-space:nowrap}
  .chip.on{background:var(--violet);color:#fff;border-color:var(--violet)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
  .seg{display:flex;background:var(--sunken);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;color:var(--t2);padding:8px;border-radius:8px;font-size:13px;font-weight:600}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px var(--shadow)}
  .tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;background:none;color:var(--faint);border-radius:0;padding:9px 2px 11px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab.on{color:var(--violet)}.tab .ti{font-size:19px}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:88%;text-align:center;box-shadow:0 8px 24px var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  a{color:var(--violet)}
  .paper{background:#fff;color:#141525;border:1px solid #E2E5F0}
  .paper .prow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #ECEEF6}
  .paper .prow:first-child{border-top:none}
  @media print{
    .tabbar,.no-print{display:none!important}
    #app{max-width:none;min-height:auto}
    .content{padding:0;overflow:visible}
    body,#app,.content{background:#fff}
    .paper{border:none}
  }
</style>
</head>
<body>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var app=document.getElementById('app'),toastEl=document.getElementById('toast');
var cfg=window.ZKA_SUPABASE||{}, sb=null;
var S={me:null,products:[],holdings:[],profiles:[],movements:[],sales:[],expenses:[],payouts:[],payout_requests:[],route:'accueil',sel:{},cart:{},nu:{role:'commercial'},pf:{emoji:'📦'},rec:{},exp:{category:'Achat stock'},finTab:'benef'};
var DAY=86400000,MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var TEAM_OVERRIDE=0.02; // commission d'équipe du responsable (% des ventes de ses commerciaux)

function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function grp(x){return (''+x).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function money(n){return grp(Math.round(n||0))+' FCFA';}
function compact(v){var a=Math.abs(v||0);if(a>=1e6)return grp((v/1e6).toFixed(1))+' M';if(a>=1e4)return grp(Math.round(v/1e3))+' k';return money(v);}
function initials(n){var p=(''+n).trim().split(/\s+/);return ((p.length===1?p[0].slice(0,2):p[0][0]+p[p.length-1][0])||'?').toUpperCase();}
var AVC=['#5A4BE0','#F5A623','#12B76A','#2E90FA','#EC4899','#0EA5E9','#8B5CF6','#14B8A6','#F97316'];
function avColor(k){var h=0;k=''+k;for(var i=0;i<k.length;i++)h=((h<<5)-h+k.charCodeAt(i))|0;return AVC[Math.abs(h)%AVC.length];}
function avatar(name,size){size=size||42;var c=avColor(name);return '<div class="av" style="width:'+size+'px;height:'+size+'px;background:'+c+';font-size:'+(size*0.36)+'px">'+esc(initials(name))+'</div>';}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.remove('show');},2400);}
function toastErr(e){toast('⚠ '+((e&&e.message)||e));}

/* ---------- Modèle ---------- */
function role(){return S.me?S.me.role:null;}
function prodById(id){for(var i=0;i<S.products.length;i++)if(S.products[i].id===id)return S.products[i];return null;}
function profById(id){for(var i=0;i<S.profiles.length;i++)if(S.profiles[i].id===id)return S.profiles[i];return null;}
function heldQty(hid,pid){for(var i=0;i<S.holdings.length;i++){var h=S.holdings[i];if(h.holder_id===hid&&h.product_id===pid)return h.qty;}return 0;}
function holdingListOf(hid){var out=[];S.holdings.forEach(function(h){if(h.holder_id===hid&&h.qty>0){var p=prodById(h.product_id);if(p)out.push({p:p,qty:h.qty});}});return out.sort(function(a,b){return a.p.name.localeCompare(b.p.name);});}
function carriedOf(hid){var t=0;S.holdings.forEach(function(h){if(h.holder_id===hid)t+=h.qty;});return t;}
function commerciauxOf(rid){return S.profiles.filter(function(p){return p.role==='commercial'&&p.mgr===rid;});}
function responsables(){return S.profiles.filter(function(p){return p.role==='responsable';});}
function commerciaux(){return S.profiles.filter(function(p){return p.role==='commercial';});}
function eligibleHolders(){if(role()==='boss')return responsables();if(role()==='responsable')return commerciauxOf(S.me.id);return [];}
function warehouseTotal(){return S.products.reduce(function(s,p){return s+(p.stock||0);},0);}
function fieldTotal(){return S.profiles.filter(function(p){return p.role!=='boss';}).reduce(function(s,p){return s+carriedOf(p.id);},0);}
function fieldTotalOf(pid){var t=0;S.profiles.forEach(function(p){if(p.role!=='boss')t+=heldQty(p.id,pid);});return t;}
function roleLabel(r){return r==='boss'?'Direction':r==='responsable'?'Responsable commercial':r==='commercial'?'Commercial':'—';}
function poste(a){if(!a)return '—';if(a.role==='boss')return a.sup?'Président':'Directeur associé';if(a.role==='responsable')return 'Responsable commercial';if(a.role==='commercial')return 'Commercial';return '—';}
function isPresident(){return !!(S.me&&S.me.role==='boss'&&S.me.sup);}
function bosses(){return S.profiles.filter(function(p){return p.role==='boss';});}
function firstName(n){return (''+n).split(' ')[0]||n;}

/* ---------- Analytique (ventes réelles) ---------- */
function salesOf(id){return S.sales.filter(function(s){return s.seller_id===id;});}
function salesResp(rid){var ids={};commerciauxOf(rid).forEach(function(c){ids[c.id]=1;});return S.sales.filter(function(s){return ids[s.seller_id];});}
function scopeSales(){if(role()==='boss')return S.sales;if(role()==='responsable')return salesResp(S.me.id);return salesOf(S.me.id);}
function sumT(a){return a.reduce(function(s,x){return s+(x.total||0);},0);}
function startDay(d){var c=new Date(d);c.setHours(0,0,0,0);return c;}
function salesToday(a){var s=+startDay(new Date()),e=s+DAY;return a.filter(function(x){var t=+new Date(x.created_at);return t>=s&&t<e;});}
function inLast(a,days){var c=Date.now()-days*DAY;return a.filter(function(s){return +new Date(s.created_at)>=c;});}
function monthRev(a){var now=new Date(),m=now.getMonth(),y=now.getFullYear();return sumT(a.filter(function(s){var d=new Date(s.created_at);return d.getMonth()===m&&d.getFullYear()===y;}));}
function seriesDaily(a,days){var today=startDay(new Date()),out=[],idx={};for(var i=days-1;i>=0;i--){var d=new Date(today.getTime()-i*DAY);out.push({label:''+d.getDate(),v:0});idx[+startDay(d)]=out.length-1;}a.forEach(function(s){var t=+startDay(new Date(s.created_at));if(idx[t]!==undefined)out[idx[t]].v+=(s.total||0);});return out;}
function rankSellers(list){return list.map(function(c){var sl=salesOf(c.id);return {c:c,count:sl.length,rev:sumT(sl)};}).sort(function(a,b){return b.rev-a.rev;});}

function lineChart(series,color){color=color||'#5A4BE0';var W=300,H=120,pt=10,pb=10,ch=H-pt-pb,max=1;series.forEach(function(d){if(d.v>max)max=d.v;});
  var pts=series.map(function(d,i){return {x:series.length<=1?W/2:i/(series.length-1)*W,y:pt+ch-d.v/max*ch};});
  function path(pp){if(pp.length<2)return 'M '+(pp[0]?pp[0].x:0)+' '+(pp[0]?pp[0].y:0);var s='M '+pp[0].x+' '+pp[0].y;for(var i=0;i<pp.length-1;i++){var p0=pp[i-1]||pp[i],p1=pp[i],p2=pp[i+1],p3=pp[i+2]||p2;s+=' C '+(p1.x+(p2.x-p0.x)/6)+' '+(p1.y+(p2.y-p0.y)/6)+', '+(p2.x-(p3.x-p1.x)/6)+' '+(p2.y-(p3.y-p1.y)/6)+', '+p2.x+' '+p2.y;}return s;}
  var lp=path(pts),ap=lp+' L '+pts[pts.length-1].x+' '+H+' L '+pts[0].x+' '+H+' Z',last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity="0.25"/><stop offset="1" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient></defs><path d="'+ap+'" fill="url(#g)"/><path d="'+lp+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last.x+'" cy="'+last.y+'" r="3.5" fill="'+color+'"/></svg>';}

/* ---------- Données ---------- */
async function loadAll(){
  var r=await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('profiles').select('*'),
    sb.from('holdings').select('*'),
    sb.from('movements').select('*').order('at',{ascending:false}).limit(40),
    sb.from('sales').select('*, sale_items(*)').order('created_at',{ascending:false}).limit(80),
    sb.from('expenses').select('*').order('at',{ascending:false}).limit(200),
    sb.from('payouts').select('*').order('paid_at',{ascending:false}).limit(200),
    sb.from('payout_requests').select('*').order('requested_at',{ascending:false}).limit(200)
  ]);
  for(var i=0;i<r.length;i++)if(r[i].error&&i<5)toastErr(r[i].error);
  S.products=r[0].data||[]; S.profiles=r[1].data||[]; S.holdings=r[2].data||[]; S.movements=r[3].data||[]; S.sales=r[4].data||[]; S.expenses=r[5].data||[]; S.payouts=r[6].data||[]; S.payout_requests=r[7].data||[];
}
var _rt=null;
function subscribe(){ if(_rt)return; _rt=sb.channel('zka').on('postgres_changes',{event:'*',schema:'public'},function(){clearTimeout(subscribe._t);subscribe._t=setTimeout(refresh,350);}).subscribe(); }
async function refresh(){ await loadAll(); render(); }

/* ---------- Auth ---------- */
async function afterLogin(){
  var u=(await sb.auth.getUser()).data.user;
  var pr=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
  if(pr.error){ renderFatal(pr.error.message); return; }
  S.me=pr.data||{id:u.id,name:u.email,role:'—'};
  await loadAll(); subscribe(); S.route='accueil'; render();
}
async function doLogin(){
  var email=(document.getElementById('email').value||'').trim();var pw=document.getElementById('pw').value||'';
  var b=document.getElementById('btnLogin');b.textContent='Connexion…';b.disabled=true;
  var res=await sb.auth.signInWithPassword({email:email,password:pw});
  if(res.error){renderLogin(res.error.message||'Identifiants incorrects');return;}
  await afterLogin();
}
async function logout(){ await sb.auth.signOut(); S.me=null; renderLogin(); }

/* ---------- Écrans de base ---------- */
function renderLogin(err){
  app.innerHTML='<div class="content"><div class="hero"><div class="cap" style="color:#fff;opacity:.85">ZKA</div><div class="h1">Connexion</div><div class="sm" style="color:#fff;opacity:.9">Espace direction & équipe</div></div>'
   +'<div class="card">'+(err?'<div class="badge dg" style="margin-bottom:10px">'+esc(err)+'</div>':'')
   +'<label>Email</label><input id="email" type="email" autocapitalize="off" placeholder="vous@exemple.com">'
   +'<label style="margin-top:12px">Mot de passe</label><input id="pw" type="password" placeholder="••••••••">'
   +'<button class="full" style="margin-top:16px" id="btnLogin">Se connecter</button></div></div>';
  document.getElementById('btnLogin').onclick=doLogin;
  document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}
function renderFatal(msg){app.innerHTML='<div class="content"><div class="card"><span class="badge dg">Erreur</span><div class="sm mut">'+esc(msg)+'</div><button class="ghost full mut" onclick="ZK.logout()">Se déconnecter</button></div></div>';}

function tabsFor(){
  if(role()==='boss')return [['accueil','🏠','Accueil'],['entrepot','📦','Entrepôt'],['attribuer','📤','Attribuer'],['finances','📊','Finances'],['equipe','👥','Équipe']];
  if(role()==='responsable')return [['accueil','🏠','Accueil'],['stock','📦','Ma réserve'],['vendre','🛒','Vendre'],['attribuer','📤','Attribuer'],['equipe','👥','Équipe']];
  return [['accueil','🏠','Accueil'],['stock','📦','Mon stock'],['vendre','🛒','Vendre'],['ventes','🧾','Ventes']];
}
function render(){
  if(!S.me){renderLogin();return;}
  var body;
  switch(S.route){
    case 'entrepot':body=viewEntrepot();break;
    case 'produit':body=viewProduit(S.sel.pid);break;
    case 'produitNew':body=viewProduitNew();break;
    case 'reception':body=viewReception();break;
    case 'finances':body=viewFinances();break;
    case 'attribuer':body=viewAttribuer();break;
    case 'terrain':body=viewTerrain();break;
    case 'equipe':body=viewEquipe();break;
    case 'profil':body=viewProfil();break;
    case 'stock':body=viewMonStock();break;
    case 'vendre':body=viewVendre();break;
    case 'ventes':body=viewVentes();break;
    case 'recu':body=viewRecu(S.sel.saleId);break;
    case 'membre':body=viewMembre(S.sel.mid);break;
    case 'bulletin':body=viewBulletin(S.sel.bid);break;
    default:body=viewAccueil();
  }
  var tabs=tabsFor();
  var bar='<div class="tabbar">'+tabs.map(function(t){return '<button class="tab '+(S.route===t[0]?'on':'')+'" onclick="ZK.go(\''+t[0]+'\')"><span class="ti">'+t[1]+'</span><span>'+t[2]+'</span></button>';}).join('')+'</div>';
  app.innerHTML='<div class="content">'+body+'</div>'+bar;
}
function topRow(){return '<div class="row between" style="margin-bottom:12px"><div class="row" style="gap:10px;cursor:pointer" onclick="ZK.go(\'profil\')">'+avatar(S.me.name,42)+'<div><div class="semi ell">'+esc(S.me.name)+'</div><div class="cap">'+poste(S.me)+' ›</div></div></div><button class="ghost" style="padding:9px 12px" onclick="ZK.logout()">Quitter</button></div>';}
function greet(){var h=new Date().getHours();return h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';}
function stat(icon,tone,label,val,go){var t={success:['var(--successS)','var(--success)'],primary:['var(--primS)','var(--violet)'],info:['var(--infoS)','var(--info)'],accent:['var(--goldS)','var(--warn)']}[tone]||['var(--alt)','var(--t2)'];var click=go?' style="cursor:pointer" onclick="ZK.go(\''+go+'\')"':'';return '<div class="stat"'+click+'><div class="ico" style="background:'+t[0]+'">'+icon+'</div><div class="h2 mut ell">'+val+'</div><div class="cap">'+label+(go?' ›':'')+'</div></div>';}
function chartCard(sales){var series=seriesDaily(sales,14);return '<div class="card"><div class="h3">'+compact(series.reduce(function(s,d){return s+d.v;},0))+'</div><div class="cap" style="margin-bottom:10px">Chiffre — 14 derniers jours</div>'+lineChart(series)+'</div>';}

/* ---------- Accueil / Tableau de bord ---------- */
function viewAccueil(){return role()==='boss'?dashBoss():role()==='responsable'?dashResp():dashCom();}

function dashBoss(){
  var all=S.sales,today=salesToday(all),h=topRow();
  h+='<div class="hero"><div class="sm" style="color:#fff;opacity:.9">Chiffre global ce mois</div><div style="font-size:31px;font-weight:800;letter-spacing:-1px">'+money(monthRev(all))+'</div>'
    +'<div class="row" style="gap:20px;margin-top:12px"><div><div class="cap" style="color:#fff;opacity:.8">Aujourd\'hui</div><div class="bold">'+compact(sumT(today))+'</div></div><div><div class="cap" style="color:#fff;opacity:.8">Ventes 30j</div><div class="bold">'+inLast(all,30).length+'</div></div></div></div>';
  h+='<div class="row" style="gap:10px;margin-bottom:12px">'+stat('📦','primary','Produits',S.products.length,'entrepot')+stat('🗺️','info','Stock terrain',fieldTotal()+' u.','terrain')+'</div>';

  h+='<div class="center" style="font-size:10px;color:#8B90A6;padding-bottom:14px">Édité le '+fmtDate(now.toISOString())+' • ZKA</div>';
  h+='</div>';
  return h;
}

/* ---------- Finances ---------- */
function totalRevenue(){return sumT(S.sales);}
function totalExpenses(){return S.expenses.reduce(function(s,e){return s+(e.amount||0);},0);}
function netProfit(){return totalRevenue()-totalExpenses();}
function shareAmount(own){return Math.round((own||0)/100*netProfit());}
function fmtDate(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}
function tenure(iso){if(!iso)return '—';var ms=Date.now()-new Date(iso).getTime();if(ms<0)ms=0;var days=Math.floor(ms/DAY);if(days<1)return "aujourd'hui";if(days<31)return days+' jour'+(days>1?'s':'');var months=Math.floor(days/30.44);if(months<12)return months+' mois';var years=Math.floor(months/12),rem=months%12;return years+' an'+(years>1?'s':'')+(rem?' '+rem+' mois':'');}
function salesSince(id,since){var t=since?+new Date(since):0;return S.sales.filter(function(s){return s.seller_id===id&&+new Date(s.created_at)>t;});}
function teamSalesSince(rid,since){var ids={};commerciauxOf(rid).forEach(function(c){ids[c.id]=1;});var t=since?+new Date(since):0;return S.sales.filter(function(s){return ids[s.seller_id]&&+new Date(s.created_at)>t;});}
function teamRate(m){return (m&&m.role==='responsable')?(m.team_comm!=null?m.team_comm:TEAM_OVERRIDE):0;}
function commParts(m){if(!m)return {perso:0,team:0,rate:0};var perso=(m.comm||0)*sumT(salesSince(m.id,m.comm_paid_at));var rate=teamRate(m);var team=rate*sumT(teamSalesSince(m.id,m.comm_paid_at));return {perso:perso,team:team,rate:rate};}
function commDue(m){if(!m)return 0;var p=commParts(m);return Math.round(p.perso+p.team);}
function payoutsOf(id){return S.payouts.filter(function(p){return p.member_id===id;});}
function pendingReq(id,kind){return S.payout_requests.filter(function(r){return r.member_id===id&&r.status==='en_attente'&&(!kind||r.kind===kind);});}
/* Cartes de rémunération de l'utilisateur connecté (commission à percevoir, salaire, historique) */
function remunCards(){
  var m=S.me,due=commDue(m),parts=commParts(m),pend=pendingReq(m.id,'commission').length,h='';
  var brk=(m.role==='responsable')?'<div class="cap mut">Perso '+money(Math.round(parts.perso))+' + prime équipe '+money(Math.round(parts.team))+' ('+Math.round(parts.rate*100)+' %)</div>':'';
  h+='<div class="card"><div class="row between"><div class="row" style="gap:10px"><div class="ico" style="background:var(--goldS)">💵</div><div><div class="semi">Ma commission à percevoir</div><div class="cap">depuis le dernier versement</div></div></div><div class="h2" style="color:var(--success)">'+money(due)+'</div></div>'+brk
    +(pend?'<div class="cap mut">⏳ Demande de versement en attente</div>':'<button class="sec full mut" '+(due<=0?'disabled':'')+' onclick="ZK.requestPayout(\'commission\','+due+')">Demander le versement</button>')+'</div>';
  if((m.salary||0)>0){var ps=pendingReq(m.id,'salaire').length;h+='<div class="card"><div class="row between"><div class="row" style="gap:10px"><div class="ico" style="background:var(--infoS)">🗓️</div><div><div class="semi">Mon salaire mensuel</div><div class="cap">fixé par la direction</div></div></div><div class="h2">'+money(m.salary)+'</div></div>'+(ps?'<div class="cap mut">⏳ Demande en attente</div>':'<button class="sec full mut" onclick="ZK.requestPayout(\'salaire\','+m.salary+')">Demander mon salaire</button>')+'</div>';}
  var mp=payoutsOf(m.id);
  if(mp.length)h+='<div class="card"><div class="h3" style="margin-bottom:6px">Mes versements reçus</div>'+mp.slice(0,8).map(function(p){return '<div class="lrow"><div class="grow"><div class="sm semi">'+(p.kind==='commission'?'Commission':'Salaire')+'</div><div class="cap">'+fmtDate(p.paid_at)+'</div></div><div class="semi" style="color:var(--success)">'+money(p.amount)+'</div></div>';}).join('')+'</div>';
  return h;
}
function grossMargin(){var m=0;S.sales.forEach(function(s){(s.sale_items||[]).forEach(function(it){var p=prodById(it.product_id);var c=p?(p.cost||0):0;m+=((it.unit_price||0)-c)*it.quantity;});});return m;}
function productStats(){var map={};S.sales.forEach(function(s){(s.sale_items||[]).forEach(function(it){var m=map[it.product_id]||(map[it.product_id]={qty:0,rev:0});m.qty+=it.quantity;m.rev+=it.quantity*(it.unit_price||0);});});
  return S.products.map(function(p){var m=map[p.id]||{qty:0,rev:0};return {p:p,qty:m.qty,rev:m.rev,margin:m.rev-m.qty*(p.cost||0)};}).sort(function(a,b){return b.rev-a.rev;});}
function productStat(pid){var qty=0,rev=0;S.sales.forEach(function(s){(s.sale_items||[]).forEach(function(it){if(it.product_id===pid){qty+=it.quantity;rev+=it.quantity*(it.unit_price||0);}});});var p=prodById(pid);return {qty:qty,rev:rev,margin:rev-qty*((p&&p.cost)||0)};}
var EXPCATS=['Achat stock','Loyer','Salaire','Transport','Autre'];

function finPaie(){
  var pres=isPresident();var h='';
  if(!pres)h+='<div class="cap" style="margin-bottom:8px">👑 Seul le président règle les salaires et effectue les versements. Vous consultez ici le suivi.</div>';
  var pend=S.payout_requests.filter(function(r){return r.status==='en_attente';});
  h+='<div class="h3" style="margin-bottom:8px">Demandes de versement ('+pend.length+')</div>';
  if(!pend.length)h+='<div class="card sm center">Aucune demande en attente.</div>';
  else h+='<div class="card">'+pend.map(function(r){var m=profById(r.member_id);var amt=r.kind==='commission'?commDue(m):((m&&m.salary)||r.amount);return '<div class="lrow wrap"><div class="grow" style="cursor:pointer" onclick="ZK.openMembre(\''+r.member_id+'\')"><div class="semi ell">'+esc(m?m.name:'?')+' ›</div><div class="cap">'+(r.kind==='commission'?'Commission':'Salaire')+' • demandé '+fmtDate(r.requested_at)+'</div></div><div class="semi">'+money(amt)+'</div>'+(pres?'<button class="rbtn" style="background:var(--successS);color:var(--success);width:auto;padding:0 12px" onclick="ZK.payMember(\''+r.member_id+'\',\''+r.kind+'\','+amt+')">Payer</button>':'')+'</div>';}).join('')+'</div>';
  h+='<div class="h3" style="margin:14px 0 8px">Rémunérations par membre</div>';
  var members=responsables().concat(commerciaux());
  if(!members.length)h+='<div class="card sm center">Aucun membre.</div>';
  else h+='<div class="card">'+members.map(function(m){var due=commDue(m);return '<div class="lrow wrap"><div class="grow" style="cursor:pointer" onclick="ZK.openMembre(\''+m.id+'\')"><div class="semi ell">'+esc(m.name)+' ›</div><div class="cap">'+poste(m)+' • comm. due '+money(due)+'</div></div>'+(pres?('<span class="cap">Sal.</span><input type="number" value="'+(m.salary||0)+'" onchange="ZK.setSalary(\''+m.id+'\',this.value)" style="width:78px;padding:8px" title="Salaire mensuel"><div class="row" style="gap:6px">'+(due>0?'<button class="rbtn" style="background:var(--goldS);color:var(--warn)" title="Payer la commission" onclick="ZK.payMember(\''+m.id+'\',\'commission\','+due+')">💵</button>':'')+((m.salary||0)>0?'<button class="rbtn" style="background:var(--infoS);color:var(--info)" title="Payer le salaire" onclick="ZK.payMember(\''+m.id+'\',\'salaire\','+m.salary+')">🗓️</button>':'')+'</div>'):('<div class="semi">'+money(m.salary||0)+'</div>'))+'</div>';}).join('')+'</div>';
  var hist=S.payouts.slice(0,25);
  h+='<div class="h3" style="margin:14px 0 8px">Versements effectués</div>';
  if(!hist.length)h+='<div class="card sm center">Aucun versement enregistré.</div>';
  else h+='<div class="card">'+hist.map(function(p){var m=profById(p.member_id);return '<div class="lrow"><div class="ico" style="background:var(--successS)">💸</div><div class="grow"><div class="sm semi">'+esc(m?m.name:'?')+' — '+(p.kind==='commission'?'Commission':'Salaire')+'</div><div class="cap">'+fmtDate(p.paid_at)+'</div></div><div class="semi" style="color:var(--success)">'+money(p.amount)+'</div></div>';}).join('')+'</div>';
  return h;
}
function viewFinances(){
  var tab=S.finTab;
  var h='<div class="h1" style="margin-bottom:12px">Finances</div>';
  h+='<div class="seg">'+[['benef','Bénéfices'],['dep','Dépenses'],['prod','Produits'],['paie','Paie']].map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="ZK.finTab(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>';
  if(tab==='dep')return h+finDepenses();
  if(tab==='prod')return h+finProduits();
  if(tab==='paie')return h+finPaie();
  return h+finBenef();
}
function finBenef(){
  var np=netProfit();
  var h='<div class="hero"><div class="sm" style="color:#fff;opacity:.9">Bénéfice net (revenus − dépenses)</div><div style="font-size:32px;font-weight:800;letter-spacing:-1px">'+money(np)+'</div><div class="sm" style="color:#fff;opacity:.9;margin-top:4px">'+(np>=0?'✅ positif':'⚠ négatif')+'</div></div>';
  h+='<div class="row" style="gap:10px;margin-bottom:12px">'+stat('💰','success','Revenus (ventes)',compact(totalRevenue()))+stat('💸','accent','Dépenses',compact(totalExpenses()))+'</div>';
  h+='<div class="row" style="gap:10px;margin-bottom:12px">'+stat('📈','primary','Marge brute',compact(grossMargin()))+stat('🧾','info','Nb ventes',S.sales.length)+'</div>';
  h+='<div class="cap" style="margin-bottom:6px">La <b>marge brute</b> = ventes − coût des produits vendus. Le <b>bénéfice net</b> = revenus − toutes les dépenses saisies.</div>';
  h+=chartCard(S.sales);
  return h;
}
function finDepenses(){
  var f=S.exp;
  var h='<div class="card"><div class="h3" style="margin-bottom:8px">Enregistrer une dépense</div>'
    +'<label>Intitulé</label><input id="exp_label" value="'+esc(f.label||'')+'" placeholder="Ex. Loyer boutique, transport…" oninput="ZK.exp(\'label\',this.value)">'
    +'<label class="mut">Montant (FCFA)</label><input id="exp_amount" type="number" inputmode="decimal" value="'+esc(f.amount||'')+'" placeholder="0" oninput="ZK.exp(\'amount\',this.value)">'
    +'<label class="mut">Catégorie</label><div class="chips" style="margin-bottom:4px">'+EXPCATS.map(function(c){return '<button class="chip '+((f.category||'Achat stock')===c?'on':'')+'" onclick="ZK.exp(\'category\',\''+c+'\')">'+c+'</button>';}).join('')+'</div>'
    +'<button class="full mut" onclick="ZK.addExpense()">Ajouter la dépense</button></div>';
  h+='<div class="card row between"><div class="sm">Total des dépenses</div><div class="h2" style="color:var(--danger)">'+money(totalExpenses())+'</div></div>';
  if(!S.expenses.length)h+='<div class="card sm center">Aucune dépense enregistrée.</div>';
  else h+='<div class="card">'+S.expenses.map(function(e){var d=new Date(e.at);return '<div class="lrow"><div class="grow"><div class="semi ell">'+esc(e.label)+'</div><div class="cap">'+esc(e.category)+' • '+d.toLocaleDateString('fr-FR')+(e.qty?' • '+e.qty+' u.':'')+'</div></div><div class="semi">'+money(e.amount)+'</div><button class="rbtn sec" onclick="ZK.delExpense(\''+e.id+'\')">🗑️</button></div>';}).join('')+'</div>';
  return h;
}
function finProduits(){
  var stats=productStats();
  var h='<div class="cap" style="margin-bottom:8px">Revenu = quantités vendues × prix. Marge = revenu − coût des unités vendues.</div>';
  if(!S.sales.length)return h+'<div class="card sm center">Aucune vente pour l\'instant — les revenus par produit apparaîtront ici.</div>';
  var maxRev=Math.max(1,stats[0]?stats[0].rev:1);
  h+='<div class="card">'+stats.map(function(x){return '<div style="padding:11px 0;border-top:1px solid var(--border)"><div class="row between"><div class="semi ell grow">'+esc(x.p.emoji||'')+' '+esc(x.p.name)+'</div><div class="semi">'+money(x.rev)+'</div></div><div class="track"><div class="fill" style="width:'+(x.rev/maxRev*100)+'%"></div></div><div class="cap mut">'+x.qty+' vendu(s) • marge '+money(x.margin)+'</div></div>';}).join('')+'</div>';
  return h;
}

else if(!window.supabase||!window.supabase.createClient){ app.innerHTML='<div class="content"><div class="card"><span class="badge dg">Hors ligne</span><div class="sm mut">La librairie Supabase n\'a pas pu être chargée (connexion internet ?).</div></div></div>'; }
else{ sb=window.supabase.createClient(cfg.url,cfg.anonKey); sb.auth.getSession().then(function(res){ if(res.data&&res.data.session)afterLogin(); else renderLogin(); }); }
})();
</script>
