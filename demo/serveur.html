<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>ZKA — Gestion de commerce</title>
<!-- ZKA build: 2026-07-11c (ventes hors-ligne : stock décrémenté localement + vente en file, envoyée et réconciliée au retour du réseau) -->
<style>
  /* ===== ZKA — thème « noir & or » premium (dark-first) ===== */
  :root{
    --gold:#E9C86A;--goldHi:#F4DE9C;--gold2:#CDA04C;--goldDeep:#B8862F;--goldInk:#2A1E06;
    --violet:#E9C86A;--violet2:#E9C86A;--violet3:#CDA04C;   /* alias : ancien violet → or */
    --bg:#0A0A0C;--surface:#16151B;--alt:#201F27;--sunken:#0F0E13;--border:#2B2A22;
    --text:#F5F1E6;--t2:#B7B1A1;--faint:#7E7869;
    --success:#37C98A;--successS:#0E2A1E;--warn:#F5B841;--warnS:#2A2210;--danger:#F5766B;--dangerS:#2C1615;--info:#5BB2FA;--infoS:#0E2033;--primS:#241E10;--goldS:#241E10;--shadow:rgba(0,0,0,.55);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text)}
  #app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
  .content{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left))}
  .h1{font-size:25px;font-weight:800;letter-spacing:-.6px}.h2{font-size:19px;font-weight:800;letter-spacing:-.3px}.h3{font-size:16px;font-weight:700}
  .sm{font-size:13px;color:var(--t2)}.cap{font-size:11px;color:var(--faint)}.bold{font-weight:700}.semi{font-weight:600}.mut{margin-top:8px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin:0 0 6px}
  input,select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;padding:12px 13px;outline:none}
  input:focus,select:focus{border-color:var(--violet)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:700;font-size:15px;padding:13px 15px;background:linear-gradient(135deg,var(--goldHi),var(--gold2));color:var(--goldInk)}
  button.sec{background:var(--alt);color:var(--text)}button.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
  button:active{opacity:.85}button:disabled{opacity:.45}
  .full{width:100%}
  .row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.center{text-align:center}
  .hero{border-radius:18px;padding:18px;background:radial-gradient(135% 120% at 16% 0%,#251E0E 0%,#15130C 44%,#0B0A08 100%);color:#fff;border:1px solid #38301A;box-shadow:0 16px 34px -16px rgba(0,0,0,.85);margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:12px;flex:1;min-width:0}
  .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .ok{background:var(--successS);color:var(--success)}.warn{background:var(--warnS);color:var(--warn)}.dg{background:var(--dangerS);color:var(--danger)}.inf{background:var(--infoS);color:var(--info)}.neu{background:var(--alt);color:var(--t2)}.acc{background:var(--goldS);color:var(--warn)}.pri{background:var(--primS);color:var(--violet)}
  .lrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border)}.lrow:first-child{border-top:none}
  .av{border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:#fff}
  .stepper{display:flex;align-items:center;gap:8px}
  .rbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;padding:0;flex:none}
  .track{height:7px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:6px}.fill{height:100%;border-radius:999px;background:var(--violet)}
  .chip{display:inline-block;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid var(--border);color:var(--t2);background:var(--surface);white-space:nowrap}
  .chip.on{background:var(--gold);color:var(--goldInk);border-color:var(--gold)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
  .seg{display:flex;background:var(--sunken);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;color:var(--t2);padding:8px;border-radius:8px;font-size:13px;font-weight:600}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px var(--shadow)}
  .tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;background:none;color:var(--faint);border-radius:0;padding:9px 2px 11px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab.on{color:var(--violet)}.tab .ti{font-size:19px}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:88%;text-align:center;box-shadow:0 8px 24px var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  a{color:var(--violet)}
  .paper{background:#fff;color:#141525;border:1px solid #E2E5F0}
  .paper .prow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #ECEEF6}
  .paper .prow:first-child{border-top:none}
  @media print{
    .tabbar,.no-print{display:none!important}
    #app{max-width:none;min-height:auto}
    .content{padding:0;overflow:visible}
    body,#app,.content{background:#fff}
    .paper{border:none}
  }
  .swipe{position:relative;overflow:hidden;border-top:1px solid var(--border)}
  .swipe:first-child{border-top:none}
  .swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex}
  .sa-btn{border-radius:0;width:58px;display:grid;place-items:center;font-size:19px;padding:0;color:#fff}
  .swipe-fg{position:relative;background:var(--surface);display:flex;align-items:center;gap:11px;padding:11px 0;transition:transform .2s ease;touch-action:pan-y}
</style>
</head>
<body>
<script src="./config.js"></script>
<script src="./supabase.min.js"></script>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var app=document.getElementById('app'),toastEl=document.getElementById('toast');
var cfg=window.ZKA_SUPABASE||{}, sb=null;
var S={me:null,products:[],holdings:[],profiles:[],movements:[],sales:[],expenses:[],payouts:[],payout_requests:[],stock_requests:[],messages:[],notifications:[],monthly:[],route:'accueil',sel:{},cart:{},nu:{role:'commercial'},pf:{emoji:'📦'},rec:{},exp:{category:'Achat stock'},req:{},finTab:'benef',chatTab:'public'};
var DAY=86400000,MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var TEAM_OVERRIDE=0.02; // commission d'équipe du responsable (% des ventes de ses commerciaux)

function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function grp(x){return (''+x).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function money(n){return grp(Math.round(n||0))+' FCFA';}
function compact(v){var a=Math.abs(v||0);if(a>=1e6)return grp((v/1e6).toFixed(1))+' M';if(a>=1e4)return grp(Math.round(v/1e3))+' k';return money(v);}
function initials(n){var p=(''+n).trim().split(/\s+/);return ((p.length===1?p[0].slice(0,2):p[0][0]+p[p.length-1][0])||'?').toUpperCase();}
var AVC=['#E9C86A','#F5B841','#34D399','#38BDF8','#F472B6','#A78BFA','#2DD4BF','#FB923C','#F87171'];
function avColor(k){var h=0;k=''+k;for(var i=0;i<k.length;i++)h=((h<<5)-h+k.charCodeAt(i))|0;return AVC[Math.abs(h)%AVC.length];}
function avatar(name,size){size=size||42;var c=avColor(name);return '<div class="av" style="width:'+size+'px;height:'+size+'px;background:'+c+';font-size:'+(size*0.36)+'px">'+esc(initials(name))+'</div>';}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.remove('show');},2400);}
function toastErr(e){var m=(e&&e.message)||(''+e);if(isOffline()||/fetch|network|Failed to fetch|NetworkError|ECONN|timeout/i.test(m)){toast('⚡ Hors ligne — action impossible pour l\'instant');return;}toast('⚠ '+m);}

/* ---------- Modèle ---------- */
function role(){return S.me?S.me.role:null;}
function prodById(id){for(var i=0;i<S.products.length;i++)if(S.products[i].id===id)return S.products[i];return null;}
function profById(id){for(var i=0;i<S.profiles.length;i++)if(S.profiles[i].id===id)return S.profiles[i];return null;}
function heldQty(hid,pid){for(var i=0;i<S.holdings.length;i++){var h=S.holdings[i];if(h.holder_id===hid&&h.product_id===pid)return h.qty;}return 0;}
function holdingListOf(hid){var out=[];S.holdings.forEach(function(h){if(h.holder_id===hid&&h.qty>0){var p=prodById(h.product_id);if(p)out.push({p:p,qty:h.qty});}});return out.sort(function(a,b){return a.p.name.localeCompare(b.p.name);});}
function carriedOf(hid){var t=0;S.holdings.forEach(function(h){if(h.holder_id===hid)t+=h.qty;});return t;}
function commerciauxOf(rid){return S.profiles.filter(function(p){return p.role==='commercial'&&p.mgr===rid;});}
function responsables(){return S.profiles.filter(function(p){return p.role==='responsable';});}
function commerciaux(){return S.profiles.filter(function(p){return p.role==='commercial';});}
function eligibleHolders(){if(role()==='boss')return responsables();if(role()==='responsable')return commerciauxOf(S.me.id);return [];}
function warehouseTotal(){return S.products.reduce(function(s,p){return s+(p.stock||0);},0);}
function fieldTotal(){return S.profiles.filter(function(p){return p.role!=='boss';}).reduce(function(s,p){return s+carriedOf(p.id);},0);}
function fieldTotalOf(pid){var t=0;S.profiles.forEach(function(p){if(p.role!=='boss')t+=heldQty(p.id,pid);});return t;}
function roleLabel(r){return r==='boss'?'Direction':r==='responsable'?'Responsable commercial':r==='commercial'?'Commercial':'—';}
function poste(a){if(!a)return '—';if(a.role==='boss')return a.sup?'Président':'Directeur associé';if(a.role==='responsable')return 'Responsable commercial';if(a.role==='commercial')return 'Commercial';return '—';}
function isPresident(){return !!(S.me&&S.me.role==='boss'&&S.me.sup);}
function bosses(){return S.profiles.filter(function(p){return p.role==='boss';});}
function firstName(n){return (''+n).split(' ')[0]||n;}

/* ---------- Analytique (ventes réelles) ---------- */
function salesOf(id){return S.sales.filter(function(s){return s.seller_id===id;});}
function salesResp(rid){var ids={};commerciauxOf(rid).forEach(function(c){ids[c.id]=1;});return S.sales.filter(function(s){return ids[s.seller_id];});}
function scopeSales(){if(role()==='boss')return S.sales;if(role()==='responsable')return salesResp(S.me.id);return salesOf(S.me.id);}
function sumT(a){return a.reduce(function(s,x){return s+(x.total||0);},0);}
function startDay(d){var c=new Date(d);c.setHours(0,0,0,0);return c;}
function salesToday(a){var s=+startDay(new Date()),e=s+DAY;return a.filter(function(x){var t=+new Date(x.created_at);return t>=s&&t<e;});}
function inLast(a,days){var c=Date.now()-days*DAY;return a.filter(function(s){return +new Date(s.created_at)>=c;});}
function monthRev(a){var now=new Date(),m=now.getMonth(),y=now.getFullYear();return sumT(a.filter(function(s){var d=new Date(s.created_at);return d.getMonth()===m&&d.getFullYear()===y;}));}
function seriesDaily(a,days){var today=startDay(new Date()),out=[],idx={};for(var i=days-1;i>=0;i--){var d=new Date(today.getTime()-i*DAY);out.push({label:''+d.getDate(),v:0});idx[+startDay(d)]=out.length-1;}a.forEach(function(s){var t=+startDay(new Date(s.created_at));if(idx[t]!==undefined)out[idx[t]].v+=(s.total||0);});return out;}
function rankSellers(list){return list.map(function(c){var sl=salesOf(c.id);return {c:c,count:sl.length,rev:sumT(sl)};}).sort(function(a,b){return b.rev-a.rev;});}
/* Crédit / créances clients */
function isUnpaidCredit(s){return s.pay==='crédit'&&!s.paid_at;}
function unpaidOf(id){return S.sales.filter(function(s){return s.seller_id===id&&isUnpaidCredit(s);});}
function scopeUnpaid(){if(role()==='boss')return S.sales.filter(isUnpaidCredit);if(role()==='responsable'){var ids={};commerciauxOf(S.me.id).forEach(function(c){ids[c.id]=1;});ids[S.me.id]=1;return S.sales.filter(function(s){return ids[s.seller_id]&&isUnpaidCredit(s);});}return unpaidOf(S.me.id);}
/* Demandes de réapprovisionnement */
function myStockReqs(){return S.stock_requests.filter(function(r){return r.requester_id===S.me.id;});}
function incomingStockReqs(){var pend=S.stock_requests.filter(function(r){return r.status==='en_attente';});if(role()==='boss')return pend.filter(function(r){var q=profById(r.requester_id);return q&&q.role==='responsable';});if(role()==='responsable')return pend.filter(function(r){var q=profById(r.requester_id);return q&&q.mgr===S.me.id;});return [];}

function lineChart(series,color){color=color||'#E9C86A';var W=300,H=120,pt=10,pb=10,ch=H-pt-pb,max=1;series.forEach(function(d){if(d.v>max)max=d.v;});
  var pts=series.map(function(d,i){return {x:series.length<=1?W/2:i/(series.length-1)*W,y:pt+ch-d.v/max*ch};});
  function path(pp){if(pp.length<2)return 'M '+(pp[0]?pp[0].x:0)+' '+(pp[0]?pp[0].y:0);var s='M '+pp[0].x+' '+pp[0].y;for(var i=0;i<pp.length-1;i++){var p0=pp[i-1]||pp[i],p1=pp[i],p2=pp[i+1],p3=pp[i+2]||p2;s+=' C '+(p1.x+(p2.x-p0.x)/6)+' '+(p1.y+(p2.y-p0.y)/6)+', '+(p2.x-(p3.x-p1.x)/6)+' '+(p2.y-(p3.y-p1.y)/6)+', '+p2.x+' '+p2.y;}return s;}
  var lp=path(pts),ap=lp+' L '+pts[pts.length-1].x+' '+H+' L '+pts[0].x+' '+H+' Z',last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity="0.25"/><stop offset="1" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient></defs><path d="'+ap+'" fill="url(#g)"/><path d="'+lp+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last.x+'" cy="'+last.y+'" r="3.5" fill="'+color+'"/></svg>';}

/* ---------- Données ---------- */
/* ---------- Hors-ligne : instantané local + état réseau ---------- */
function isOffline(){return S._offline===true||(typeof navigator!=='undefined'&&navigator.onLine===false);}
function snapKey(uid){return 'zk_snap_v1_'+(uid||(S.me&&S.me.id)||'anon');}
function saveSnapshot(){if(!S.me||!S.me.id)return;try{var cap=function(a,n){return (a&&a.length>n)?a.slice(0,n):(a||[]);};var snap={v:1,ts:Date.now(),me:S.me,products:S.products,profiles:S.profiles,holdings:S.holdings,movements:cap(S.movements,120),sales:cap(S.sales,150),expenses:cap(S.expenses,150),payouts:cap(S.payouts,150),payout_requests:S.payout_requests,stock_requests:S.stock_requests,messages:cap(S.messages,150),notifications:cap(S.notifications,60),monthly:S.monthly};localStorage.setItem(snapKey(S.me.id),JSON.stringify(snap));}catch(e){}}
function loadSnapshot(uid){try{var s=localStorage.getItem(snapKey(uid));return s?JSON.parse(s):null;}catch(e){return null;}}
function applySnapshot(snap){if(!snap)return;['products','profiles','holdings','movements','sales','expenses','payouts','payout_requests','stock_requests','messages','notifications','monthly'].forEach(function(k){if(snap[k])S[k]=snap[k];});S._syncTs=snap.ts||null;}
function syncLabel(){if(!S._syncTs)return '';var d=new Date(S._syncTs),now=new Date();var sameDay=d.toDateString()===now.toDateString();return ' ('+(sameDay?"aujourd'hui ":d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' ')+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+')';}
function setupNet(){if(setupNet._d)return;setupNet._d=true;S._offline=!navigator.onLine;window.addEventListener('online',function(){S._offline=false;toast('De retour en ligne — actualisation…');refresh();});window.addEventListener('offline',function(){S._offline=true;render();});}
/* ---------- File d'attente hors-ligne (messages) ---------- */
function outKey(){return 'zk_outbox_v1_'+((S.me&&S.me.id)||'anon');}
function outboxLoad(){try{var s=localStorage.getItem(outKey());S._outbox=s?JSON.parse(s):[];}catch(e){S._outbox=[];}}
function outboxSave(){try{localStorage.setItem(outKey(),JSON.stringify(S._outbox||[]));}catch(e){}}
function outboxAdd(item){S._outbox=S._outbox||[];S._outbox.push(item);outboxSave();}
function newOid(){return Date.now()+'-'+(S._outSeq=(S._outSeq||0)+1);}
function pendingMsgObj(o){return {id:'pending-'+o.oid,scope:o.scope,sender_id:S.me.id,recipient_id:o.recipient_id,kind:'text',body:o.body,reply_to:o.reply_to,created_at:new Date(o.ts).toISOString(),_pending:true};}
function pendingFor(scope,peer){return (S._outbox||[]).filter(function(o){return o.scope===scope&&(scope!=='dm'||o.recipient_id===peer);}).map(pendingMsgObj);}
function queueMsg(scope,peer,body,reply){outboxAdd({oid:newOid(),scope:scope,recipient_id:(scope==='dm'?peer:null),body:body,reply_to:reply||null,ts:Date.now()});}
function makeOfflineSale(items,pay,cust){
  for(var i=0;i<items.length;i++){ if(items[i].quantity>heldQty(S.me.id,items[i].product_id)){toast('Stock insuffisant pour cette vente');return null;} }
  var oid=newOid(),nowISO=new Date().toISOString();
  var saleItems=items.map(function(it){var p=prodById(it.product_id);return {product_id:it.product_id,name:(p?p.name:''),quantity:it.quantity,unit_price:(p?p.price:0),comm_pct:(p&&p.comm_pct!=null?p.comm_pct:0.05)};});
  var total=saleItems.reduce(function(s,it){return s+it.quantity*it.unit_price;},0);
  var sale={id:'pending-sale-'+oid,ref:'⏳ EN FILE',seller_id:S.me.id,total:total,pay:pay,customer:cust,paid_at:(pay==='crédit'?null:nowISO),created_at:nowISO,sale_items:saleItems,_pending:true};
  saleItems.forEach(function(it){ for(var j=0;j<S.holdings.length;j++){var hh=S.holdings[j];if(hh.holder_id===S.me.id&&hh.product_id===it.product_id){hh.qty=Math.max(0,hh.qty-it.quantity);break;}} });
  S.sales.unshift(sale);
  outboxAdd({oid:oid,kind:'sale',items:items,pay:pay,customer:cust,total:total,ts:Date.now()});
  saveSnapshot();
  return sale;
}
async function flushOutbox(){
  if(isOffline()||!S._outbox||!S._outbox.length||!S.me)return;
  var q=S._outbox.slice();
  for(var i=0;i<q.length;i++){var o=q[i];var r=null,failMsg=null;
    try{
      if(o.kind==='sale'){ r=await sb.rpc('record_sale',{p_items:o.items,p_pay:o.pay,p_customer:o.customer||null}); }
      else { var row={scope:o.scope,sender_id:S.me.id,body:o.body,kind:'text'};if(o.scope==='dm')row.recipient_id=o.recipient_id;if(o.reply_to)row.reply_to=o.reply_to; r=await sb.from('messages').insert(row); }
    }catch(e){ r={error:e}; }
    if(r&&r.error){
      var msg=r.error.message||'';
      if(isOffline()||/fetch|network|Failed|NetworkError/i.test(msg))return; // réseau : on garde et on réessaiera
      if(o.kind==='sale')failMsg='⚠ Une vente n\'a pas pu être enregistrée'+(o.customer?' ('+o.customer+')':'')+' — '+money(o.total||0)+'. À refaire. Motif : '+msg;
    }

async function loadAll(){
  var q=[
    sb.from('products').select('*').order('name'),
    sb.from('profiles').select('*'),
    sb.from('holdings').select('*'),
    sb.from('movements').select('*').order('at',{ascending:false}).limit(300),
    sb.from('sales').select('*, sale_items(*)').order('created_at',{ascending:false}).limit(400),
    sb.from('expenses').select('*').order('at',{ascending:false}).limit(400),
    sb.from('payouts').select('*').order('paid_at',{ascending:false}).limit(400),
    sb.from('payout_requests').select('*').order('requested_at',{ascending:false}).limit(200),
    sb.from('stock_requests').select('*').order('requested_at',{ascending:false}).limit(200),
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(400),
    sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100)
  ];
  var r=await Promise.all(q.map(function(p){return Promise.resolve(p).then(function(x){return x;},function(e){return {error:e,data:null};});}));
  var keys=['products','profiles','holdings','movements','sales','expenses','payouts','payout_requests','stock_requests','messages','notifications'];
  var okCount=0;
  for(var i=0;i<keys.length;i++){ if(r[i]&&!r[i].error){ S[keys[i]]=r[i].data||[]; okCount++; } }
  var online=okCount>0;

  if(online){ S._offline=false; S._syncTs=Date.now(); saveSnapshot(); } else { S._offline=true; }

}

function maxMsgTs(){var mx=0;S.messages.forEach(function(m){var t=+new Date(m.created_at);if(t>mx)mx=t;});return mx;}
function notifyNew(prevMax){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(!document.hidden && (S.route==='chat'||S.route==='dm'))return; // déjà en train de regarder le chat
    var me=S.me&&S.me.id;
    S.messages.filter(function(m){return +new Date(m.created_at)>prevMax&&m.sender_id!==me&&(m.scope==='public'||m.recipient_id===me);})
      .forEach(function(m){var s=profById(m.sender_id);try{var n=new Notification((m.scope==='public'?'💬 ':'🔒 ')+((s&&s.name)||'Message'),{body:(m.kind==='text'?(m.body||''):msgPreview(m)),icon:'./icon.svg',tag:m.id});n.onclick=function(){try{window.focus();}catch(e){}n.close();};}catch(e){}});
  }catch(e){}
}
function maxNotifTs(){var mx=0;S.notifications.forEach(function(n){var t=+new Date(n.created_at);if(t>mx)mx=t;});return mx;}
function notifUnread(){return S.notifications.filter(function(n){return !n.read;}).length;}
function notifIcon(k){return k==='stock'?'📦':k==='demande'?'📥':k==='vente'?'🧾':k==='versement'?'💵':k==='alerte'?'⚠️':'🔔';}
function notifyNewNotifs(prevMax){
  try{
    var fresh=S.notifications.filter(function(n){return +new Date(n.created_at)>prevMax;});
    if(!fresh.length)return;
    var last=fresh[0];
    if(!document.hidden){toast(notifIcon(last.kind)+' '+(last.title||'Notification'));}

      fresh.slice(0,3).forEach(function(n){try{var no=new Notification((n.title||'Notification'),{body:n.body||'',icon:'./icon.svg',tag:'notif-'+n.id});no.onclick=function(){try{window.focus();}catch(e){}no.close();};}catch(e){}});
    }
  }catch(e){}
}

async function afterLogin(){
  // Identité via la session locale (fonctionne même hors-ligne)
  var sess=null; try{ sess=(await sb.auth.getSession()).data.session; }catch(e){}
  var u=sess&&sess.user;
  // Affichage instantané depuis le cache de ce compte (même sans réseau)
  var snap=u?loadSnapshot(u.id):null;
  if(snap){ applySnapshot(snap); if(snap.me)S.me=snap.me; }
  if(u){ try{ var pr=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(); if(pr&&!pr.error&&pr.data)S.me=pr.data; }catch(e){} if(!S.me)S.me={id:u.id,name:(u.email||'—'),role:'—'}; }
  if(!S.me){ renderLogin(); return; }
  setupNet(); outboxLoad();
  await loadAll();
  S._maxMsgTs=maxMsgTs(); S._maxNotifTs=maxNotifTs(); subscribe(); S.route='accueil'; render();
  if((S._outbox||[]).length&&!isOffline())refresh();
  try{if(!localStorage.getItem('zk_swipe')){localStorage.setItem('zk_swipe','1');setTimeout(function(){toast('Astuce : glissez ◀ ▶ pour changer d\'onglet');},1000);}}catch(e){}

/* ---------- Entrepôt (boss) ---------- */
function viewEntrepot(){
  var h='<div class="h1" style="margin-bottom:12px">Entrepôt central</div>';

  h+='<div class="row" style="gap:10px;margin-bottom:8px"><button class="grow" onclick="ZK.go(\'produitNew\')">➕ Nouveau produit</button><button class="sec grow" onclick="ZK.go(\'reception\')">📥 Réceptionner</button></div>';
  h+='<div class="cap" style="margin-bottom:10px">Saisissez le stock réel puis « ✓ » pour corriger l\'inventaire (une confirmation s\'affiche). Pour un achat, « Réceptionner » ou glissez la ligne → 📥 (enregistre la dépense).</div>';
  if(!S.products.length)h+='<div class="card sm center">Aucun produit. Ajoutez-en un.</div>';
  else h+='<div class="card">'+S.products.map(function(p){
    var inner='<div class="grow" style="cursor:pointer;min-width:0" onclick="ZK.openProduct(\''+p.id+'\')"><div class="semi ell">'+esc(p.emoji||'📦')+' '+esc(p.name)+' ›</div><div class="cap ell">'+esc(p.cat)+' • vente '+money(p.price)+' • coût '+money(p.cost)+'</div></div>'
      +'<input id="stk_'+p.id+'" type="number" inputmode="numeric" min="0" value="'+p.stock+'" title="Stock réel" style="width:58px;padding:9px 6px;text-align:center">'
      +'<button class="rbtn" style="width:auto;padding:0 12px;background:var(--alt);color:var(--text)" onclick="ZK.setStock(\''+p.id+'\')">✓</button>';
    return swipeRow(inner,'','',[{e:'📥',c:'var(--violet)',fn:"ZK.receiveFor('"+p.id+"')"}]);
  }).join('')+'</div>';

}
function miniStat(l,v){return '<div class="grow center"><div class="h2">'+v+'</div><div class="cap">'+l+'</div></div>';}
function warehouseValue(){return S.products.reduce(function(s,p){return s+(p.stock||0)*(p.cost||0);},0);}
function backBtn(to){return '<button class="ghost" style="padding:8px 12px;margin-bottom:12px" onclick="ZK.go(\''+to+'\')">← Retour</button>';}
/* Ligne glissable : glisser vers la gauche révèle les boutons d'action à droite. */
function swipeRow(fgInner,fgStyle,openClick,actions){
  var acts=actions.map(function(a){return '<button class="sa-btn" style="background:'+a.c+'" onclick="'+a.fn+'">'+a.e+'</button>';}).join('');
  var style=(fgStyle||'')+(openClick?';cursor:pointer':'');
  return '<div class="swipe"><div class="swipe-actions">'+acts+'</div><div class="swipe-fg"'+(style?' style="'+style+'"':'')+(openClick?' onclick="'+openClick+'"':'')+'>'+fgInner+'</div></div>';
}
var EMOJIS=['📦','🥤','💧','🍚','🛢️','🧼','☕','🥛','🔌','🎧','👕','🧢','🍪','🍯','🧂','🥫','🍅','🧴','💊','📱','👟','🔋'];

  if(isBoss){
    h+='<div class="card"><div class="row between"><div><div class="h1">'+p.stock+'</div><div class="cap">en entrepôt</div></div><div style="text-align:right"><div class="h3">'+field+'</div><div class="cap">sur le terrain</div></div><div style="text-align:right"><div class="h3">'+compact((p.stock||0)*(p.cost||0))+'</div><div class="cap">valeur (coût)</div></div></div>';

    h+='<div class="row" style="gap:10px;margin-top:10px;align-items:center"><div class="grow"><div class="cap">Commission vendeur (%)</div><div class="cap" id="pc_hint_'+pid+'" style="color:var(--warn)">≈ '+money(Math.round(pct*(p.price||0)))+' par unité vendue</div></div><input id="pc_'+pid+'" type="number" inputmode="decimal" min="0" step="0.5" value="'+(Math.round(pct*1000)/10)+'" oninput="ZK.pcHint(\''+pid+'\')" style="width:64px;padding:9px 6px;text-align:center"><span class="cap">%</span><button class="rbtn" style="width:auto;padding:0 12px;background:var(--alt);color:var(--text)" onclick="ZK.setProdComm(\''+pid+'\')">✓</button></div>';
    h+='<button class="sec full mut" onclick="ZK.receiveFor(\''+pid+'\')">📥 Réceptionner (achat)</button></div>';
    var holders=responsables().concat(commerciaux()).filter(function(a){return heldQty(a.id,pid)>0;}).sort(function(a,b){return heldQty(b.id,pid)-heldQty(a.id,pid);});
    h+='<div class="card"><div class="h3" style="margin-bottom:6px">Détenu par</div>'+(holders.length?holders.map(function(a){return '<div class="lrow"><div class="grow"><div class="semi ell">'+esc(a.name)+'</div><div class="cap">'+roleLabel(a.role)+'</div></div><div class="bold">'+heldQty(a.id,pid)+'</div></div>';}).join(''):'<div class="sm">Personne ne détient ce produit pour l\'instant.</div>')+'</div>';
    h+='<div class="card"><div class="h3" style="margin-bottom:8px">Ventes de ce produit</div><div class="row">'+miniStat('Vendus',st.qty)+miniStat('Revenu',compact(st.rev))+miniStat('Marge',compact(st.margin))+'</div></div>';
    var mv=S.movements.filter(function(m){return m.product_id===pid;}).slice(0,8);
    if(mv.length)h+='<div class="card"><div class="h3" style="margin-bottom:6px">Mouvements récents</div>'+mv.map(function(m){var a=profById(m.holder_id),inn=m.qty>0,d=new Date(m.at);return '<div class="lrow"><div class="ico" style="background:'+(inn?'var(--successS)':'var(--warnS)')+'">'+(inn?'⬇️':'⬆️')+'</div><div class="grow"><div class="sm semi">'+(inn?'+':'')+m.qty+' '+(inn?'→ ':'← ')+esc(a?firstName(a.name):'?')+'</div><div class="cap">'+d.toLocaleDateString('fr-FR')+'</div></div></div>';}).join('')+'</div>';
  } else {
    h+='<div class="card"><div class="row between"><div><div class="h1">'+mine+'</div><div class="cap">j\'en détiens</div></div><div style="text-align:right"><div class="h3">'+field+'</div><div class="cap">sur le terrain (tous)</div></div></div></div>';

    +'<label class="mut">Quantité souhaitée</label><input id="req_qty" type="number" inputmode="numeric" value="'+esc(f.qty||'')+'" placeholder="0" oninput="ZK.req(\'qty\',this.value)">'

  if(mr.length)h+='<div style="margin-top:10px"><div class="cap" style="font-weight:700;margin-bottom:2px">MES DEMANDES</div>'+mr.map(function(r){var p=prodById(r.product_id),st=r.status==='en_attente'?'<span class="badge warn">en attente</span>':(r.status==='fait'?'<span class="badge ok">fait</span>':'<span class="badge dg">refusé</span>');return '<div class="lrow"><div class="grow"><div class="sm semi ell">'+esc(p?p.name:'?')+' × '+r.qty+'</div><div class="cap">'+fmtDate(r.requested_at)+'</div></div>'+st+'</div>';}).join('')+'</div>';

      +'<button class="rbtn sec" style="width:auto;padding:0 10px" '+(held<=0?'disabled':'')+' onclick="ZK.takeBack(\''+hid+'\',\''+p.id+'\')" title="Reprendre">↩︎</button></div>';

function viewRecu(id){
  var s=null;for(var i=0;i<S.sales.length;i++)if(S.sales[i].id===id)s=S.sales[i];

  if(s._pending)h+='<div style="margin:0 0 12px;padding:9px 12px;border-radius:10px;background:var(--goldS);color:var(--gold);text-align:center;font-size:12px;font-weight:700">⏳ Vente en file — sera envoyée au retour du réseau</div>';

  h+='<div style="padding:16px">';
  h+='<div class="lrow between"><span class="sm">Date</span><span class="semi">'+d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</span></div>';
  h+='<div class="lrow between"><span class="sm">Vendeur</span><span class="semi">'+esc(seller?seller.name:'—')+'</span></div>';
  h+='<div class="lrow between"><span class="sm">Client</span><span class="semi">'+esc(s.customer||'Client comptant')+'</span></div>';

/* ===== Vocaux : ré-encodage MP3 pour lecture universelle (iPhone + Android) ===== */
var _mp3Loading=null;
function ensureMp3(){
  if(window.lamejs&&window.lamejs.Mp3Encoder)return Promise.resolve();
  if(_mp3Loading)return _mp3Loading;
  _mp3Loading=new Promise(function(res,rej){var s=document.createElement('script');s.src='./lame.min.js';s.onload=function(){res();};s.onerror=function(){_mp3Loading=null;rej(new Error('lame load failed'));};document.head.appendChild(s);});
  return _mp3Loading;
}
function blobBuf(b){if(b.arrayBuffer)return b.arrayBuffer();return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){rej(fr.error);};fr.readAsArrayBuffer(b);});}
function decodeAudio(buf){return new Promise(function(res,rej){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){rej(new Error('no AudioContext'));return;}var ctx=new AC();var done=false;var p=ctx.decodeAudioData(buf,function(d){done=true;res(d);try{ctx.close&&ctx.close();}catch(e){}},function(e){done=true;rej(e||new Error('decode failed'));try{ctx.close&&ctx.close();}catch(e2){}});if(p&&p.then){p.then(function(d){if(!done){done=true;res(d);try{ctx.close&&ctx.close();}catch(e){}}},function(e){if(!done){done=true;rej(e);try{ctx.close&&ctx.close();}catch(e2){}}});}});}
function audioToMono(ab){var ch=ab.numberOfChannels;if(ch<=1)return ab.getChannelData(0);var len=ab.length,out=new Float32Array(len);for(var c=0;c<ch;c++){var d=ab.getChannelData(c);for(var i=0;i<len;i++)out[i]+=d[i]/ch;}return out;}
function pcmToMp3Blob(data,sampleRate){
  var target=16000;if(sampleRate<target)target=sampleRate;
  var ratio=sampleRate/target,outLen=Math.floor(data.length/ratio),pcm=new Int16Array(outLen);
  for(var i=0;i<outLen;i++){var start=Math.floor(i*ratio),end=Math.floor((i+1)*ratio),sum=0,cnt=0;for(var k=start;k<end&&k<data.length;k++){sum+=data[k];cnt++;}var s=cnt?sum/cnt:0;if(s>1)s=1;else if(s<-1)s=-1;pcm[i]=s<0?s*0x8000:s*0x7FFF;}
  var enc=new window.lamejs.Mp3Encoder(1,target,32),block=1152,parts=[];
  for(var j=0;j<pcm.length;j+=block){var chunk=pcm.subarray(j,j+block),mp3buf=enc.encodeBuffer(chunk);if(mp3buf.length)parts.push(new Int8Array(mp3buf));}
  var flush=enc.flush();if(flush.length)parts.push(new Int8Array(flush));
  return new Blob(parts,{type:'audio/mpeg'});
}
async function toUniversalAudio(blob,mt){
  // Déjà lisible partout (AAC/mp4/mp3) → on garde tel quel.
  if(/mp4|m4a|aac|mpeg|mp3/i.test(mt))return null;
  await ensureMp3();
  var ab=await blobBuf(blob);
  var audio=await decodeAudio(ab);
  var mono=audioToMono(audio);
  var mp3=pcmToMp3Blob(mono,audio.sampleRate);
  return (mp3&&mp3.size)?mp3:null;
}

/* ---------- Finances ---------- */
// Rapport mensuel : agrégat serveur (tout l'historique) si dispo, sinon calcul local.
function monthlyRows(){
  if(S.monthly&&S.monthly.length)return S.monthly.map(function(r){var rev=+r.revenue||0,exp=+r.expenses||0;return {period:r.period,revenue:rev,units_sold:+r.units_sold||0,stock_released:+r.stock_released||0,expenses:exp,sales_count:+r.sales_count||0,profit:rev-exp};});
  var map={};function m(k){return map[k]||(map[k]={period:k,revenue:0,units_sold:0,stock_released:0,expenses:0,sales_count:0});}
  S.sales.forEach(function(s){var o=m(saleMonth(s));o.revenue+=s.total||0;o.sales_count++;(s.sale_items||[]).forEach(function(it){o.units_sold+=it.quantity||0;});});
  S.expenses.forEach(function(e){var o=m(monthKey(new Date(e.at)));o.expenses+=e.amount||0;});
  S.movements.forEach(function(mv){if((mv.qty||0)>0){var by=profById(mv.by_id);if(by&&by.role==='boss'){m(monthKey(new Date(mv.at))).stock_released+=mv.qty;}}});
  return Object.keys(map).map(function(k){var o=map[k];o.profit=o.revenue-o.expenses;return o;}).sort(function(a,b){return a.period<b.period?1:-1;});
}
function monthRow(mk){var r=monthlyRows();for(var i=0;i<r.length;i++)if(r[i].period===mk)return r[i];return {period:mk,revenue:0,units_sold:0,stock_released:0,expenses:0,sales_count:0,profit:0};}
function grandTotals(){var r=monthlyRows(),t={revenue:0,expenses:0,units_sold:0,stock_released:0,sales_count:0};r.forEach(function(o){t.revenue+=o.revenue;t.expenses+=o.expenses;t.units_sold+=o.units_sold;t.stock_released+=o.stock_released;t.sales_count+=o.sales_count;});t.profit=t.revenue-t.expenses;return t;}
function totalRevenue(){if(S.monthly&&S.monthly.length)return S.monthly.reduce(function(s,r){return s+(+r.revenue||0);},0);return sumT(S.sales);}
function totalExpenses(){if(S.monthly&&S.monthly.length)return S.monthly.reduce(function(s,r){return s+(+r.expenses||0);},0);return S.expenses.reduce(function(s,e){return s+(e.amount||0);},0);}
function netProfit(){return totalRevenue()-totalExpenses();}
function shareAmount(own){return Math.max(0,Math.round((own||0)/100*netProfit()));}
function fmtDate(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}
function tenure(iso){if(!iso)return '—';var ms=Date.now()-new Date(iso).getTime();if(ms<0)ms=0;var days=Math.floor(ms/DAY);if(days<1)return "aujourd'hui";if(days<31)return days+' jour'+(days>1?'s':'');var months=Math.floor(days/30.44);if(months<12)return months+' mois';var years=Math.floor(months/12),rem=months%12;return years+' an'+(years>1?'s':'')+(rem?' '+rem+' mois':'');}
/* ---------- Périodes mensuelles ---------- */
function pad2(n){return (n<10?'0':'')+n;}
function monthKey(d){d=d||new Date();return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1);}
function curMonth(){return monthKey(new Date());}
function saleMonth(s){return monthKey(new Date(s.created_at));}
function monthLabel(mk){var p=(''+mk).split('-'),mi=parseInt(p[1],10)-1;return (MO[mi]||'?').replace('.','')+' '+p[0];}
function shiftMonth(mk,delta){var p=(''+mk).split('-');return monthKey(new Date(Date.UTC(+p[0],(+p[1]-1)+delta,1)));}
function teamRate(m){return (m&&m.role==='responsable')?(m.team_comm!=null?m.team_comm:TEAM_OVERRIDE):0;}
function salesInMonth(id,mk){return S.sales.filter(function(s){return s.seller_id===id&&saleMonth(s)===mk;});}
function teamSalesInMonth(rid,mk){var ids={};commerciauxOf(rid).forEach(function(c){ids[c.id]=1;});return S.sales.filter(function(s){return ids[s.seller_id]&&saleMonth(s)===mk;});}
function saleComm(s){var t=0;(s.sale_items||[]).forEach(function(it){var pct=(it.comm_pct!=null)?it.comm_pct:((prodById(it.product_id)||{}).comm_pct);if(pct==null)pct=0.05;t+=pct*(it.quantity||0)*(it.unit_price||0);});return t;}
function commParts(m,mk){if(!m)return {perso:0,team:0,rate:0};var perso=salesInMonth(m.id,mk).reduce(function(s,x){return s+saleComm(x);},0),rate=teamRate(m),team=rate*sumT(teamSalesInMonth(m.id,mk));return {perso:perso,team:team,rate:rate};}
function earnedComm(m,mk){if(!m)return 0;var p=commParts(m,mk);return Math.round(p.perso+p.team);}
function paidFor(id,kind,mk){return S.payouts.filter(function(p){return p.member_id===id&&p.kind===kind&&p.period===mk;}).reduce(function(s,p){return s+(p.amount||0);},0);}
function dueComm(m,mk){if(!m)return 0;return earnedComm(m,mk)-paidFor(m.id,'commission',mk);}
function dueSalary(m,mk){if(!m)return 0;return (m.salary||0)-paidFor(m.id,'salaire',mk);}
/* Cumul dû tous mois confondus (chaque mois clampé à 0, jamais négatif) */
function memberStartMonth(m){return monthKey(new Date(m&&m.created_at?m.created_at:Date.now()));}
function monthsRange(fromMk,toMk){var arr=[],mk=fromMk,g=0;while(mk<=toMk&&g<600){arr.push(mk);mk=shiftMonth(mk,1);g++;}return arr;}
function totalDue(m,kind){if(!m)return 0;var t=0;monthsRange(memberStartMonth(m),curMonth()).forEach(function(mk){var earned=(kind==='commission')?earnedComm(m,mk):(m.salary||0);t+=Math.max(0,earned-paidFor(m.id,kind,mk));});return t;}
function totalDueAll(m){return totalDue(m,'commission')+totalDue(m,'salaire');}
function remunHistory(m){var rows=[];monthsRange(memberStartMonth(m),curMonth()).forEach(function(mk){var eC=earnedComm(m,mk),pC=paidFor(m.id,'commission',mk),rC=Math.max(0,eC-pC);var sal=m.salary||0,pS=paidFor(m.id,'salaire',mk),rS=Math.max(0,sal-pS);if(eC>0||pC>0||sal>0||pS>0)rows.push({mk:mk,eC:eC,pC:pC,rC:rC,sal:sal,pS:pS,rS:rS});});return rows.reverse();}
function monthNav(mk,action){return '<div class="row between" style="margin-bottom:12px;background:var(--sunken);border-radius:11px;padding:6px 8px"><button class="rbtn sec" onclick="ZK.'+action+'(\''+shiftMonth(mk,-1)+'\')">‹</button><div class="semi" style="text-transform:capitalize">'+monthLabel(mk)+'</div><button class="rbtn sec" '+(mk>=curMonth()?'disabled':'')+' onclick="ZK.'+action+'(\''+shiftMonth(mk,1)+'\')">›</button></div>';}

function finProduits(){
  var stats=productStats();
  var h='<div class="cap" style="margin-bottom:8px">Revenu = quantités vendues × prix. Marge = revenu − coût des unités vendues.</div>';
  if(!S.sales.length)return h+'<div class="card sm center">Aucune vente pour l\'instant — les revenus par produit apparaîtront ici.</div>';

  h+='<div class="card">'+stats.map(function(x){return '<div style="padding:11px 0;border-top:1px solid var(--border)"><div class="row between"><div class="semi ell grow">'+esc(x.p.emoji||'')+' '+esc(x.p.name)+'</div><div class="semi">'+money(x.rev)+'</div></div><div class="track"><div class="fill" style="width:'+(x.rev/maxRev*100)+'%"></div></div><div class="cap mut">'+x.qty+' vendu(s) • marge '+money(x.margin)+'</div></div>';}).join('')+'</div>';
  return h;
}

  recStart:async function(scope,peer){if(S._recPreview){toast('Terminez le vocal en cours');return;}if(!navigator.mediaDevices||!window.MediaRecorder){toast('Vocal non supporté sur cet appareil');return;}try{ensureMp3().catch(function(){});var stream=await navigator.mediaDevices.getUserMedia({audio:true});var types=['audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/aac','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg'];var mime='';for(var i=0;i<types.length;i++){try{if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){mime=types[i];break;}}catch(e){}}var mr;try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){mr=new MediaRecorder(stream);}S._rec={on:true,mr:mr,chunks:[],scope:scope,peer:peer,stream:stream,mime:mime,sec:0,abort:false,timer:null};mr.ondataavailable=function(e){if(e.data&&e.data.size)S._rec.chunks.push(e.data);};mr.onstop=function(){var rc=S._rec;S._rec=null;if(rc&&rc.timer)clearInterval(rc.timer);try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){}if(!rc||rc.abort){render();return;}var mt=(rc.chunks[0]&&rc.chunks[0].type)||rc.mime||mr.mimeType||'audio/webm';var blob=new Blob(rc.chunks,{type:mt});if(!blob.size){render();return;}var url=URL.createObjectURL(blob);S._recPreview={blob:blob,mime:mt,scope:rc.scope,peer:rc.peer,dur:rc.sec,url:url};render();};mr.start();S._rec.timer=setInterval(function(){if(!S._rec)return;S._rec.sec++;var el=document.getElementById('recTimer');if(el)el.textContent=fmtDur(S._rec.sec);var fl=document.getElementById('recFill');if(fl)fl.style.width=Math.min(100,S._rec.sec/REC_MAX*100)+'%';if(S._rec.sec>=REC_MAX){toast('Durée maximale atteinte (2 min)');window.ZK.recStop();}},1000);render();}catch(e){toast('Micro indisponible ou refusé');if(S._rec&&S._rec.timer)clearInterval(S._rec.timer);S._rec=null;}},
  recStop:function(){if(S._rec){if(S._rec.timer)clearInterval(S._rec.timer);if(S._rec.mr&&S._rec.mr.state!=='inactive'){try{S._rec.mr.stop();}catch(e){S._rec=null;render();}}else{S._rec=null;render();}}},
  recCancel:function(){if(S._rec){S._rec.abort=true;if(S._rec.timer)clearInterval(S._rec.timer);if(S._rec.mr&&S._rec.mr.state!=='inactive'){try{S._rec.mr.stop();}catch(e){S._rec=null;render();}}else{S._rec=null;render();}}},
  recPlay:function(){var p=S._recPreview;if(!p)return;var b=document.getElementById('recPlayBtn');if(S._recAudio){if(S._recAudio.paused){S._recAudio.play();if(b)b.textContent='⏸';}else{S._recAudio.pause();if(b)b.textContent='▶';}return;}var a=new Audio(p.url);S._recAudio=a;a.onended=function(){if(b)b.textContent='▶';S._recAudio=null;};a.play().then(function(){if(b)b.textContent='⏸';}).catch(function(){toast('Lecture impossible');});},
  recDiscard:function(){var p=S._recPreview;S._recPreview=null;if(S._recAudio){try{S._recAudio.pause();}catch(e){}S._recAudio=null;}if(p){try{URL.revokeObjectURL(p.url);}catch(e){}}toast('Vocal supprimé');render();},
  recSend:async function(){var p=S._recPreview;if(!p)return;if(S._recAudio){try{S._recAudio.pause();}catch(e){}S._recAudio=null;}S._recPreview=null;try{URL.revokeObjectURL(p.url);}catch(e){}render();toast('Traitement du vocal…');var blob=p.blob,mt=p.mime;var ext=(mt.indexOf('mp4')>=0||mt.indexOf('aac')>=0)?'m4a':mt.indexOf('ogg')>=0?'ogg':'webm';var ctype=ext==='m4a'?'audio/mp4':ext==='ogg'?'audio/ogg':'audio/webm';try{var mp3=await toUniversalAudio(blob,mt);if(mp3){blob=mp3;ext='mp3';ctype='audio/mpeg';}}catch(e){}toast('Envoi du vocal…');var path=S.me.id+'/'+Date.now()+'_vocal.'+ext;var up=await sb.storage.from('chat').upload(path,blob,{contentType:ctype});if(up.error){toastErr(up.error);render();return;}var url=sb.storage.from('chat').getPublicUrl(path).data.publicUrl;var row={scope:p.scope,sender_id:S.me.id,kind:'audio',url:url,name:String(p.dur)};if(p.scope==='dm')row.recipient_id=p.peer;var r=await sb.from('messages').insert(row);if(r.error)toastErr(r.error);await refresh();},
  playVoice:function(id,url){var b=document.getElementById('va-'+id+'-b'),f=document.getElementById('va-'+id+'-f'),t=document.getElementById('va-'+id+'-t');if(S._vp&&S._vp.id===id){if(S._vp.a.paused){S._vp.a.play();if(b)b.textContent='⏸';}else{S._vp.a.pause();if(b)b.textContent='▶';}return;}if(S._vp){try{S._vp.a.pause();}catch(e){}if(S._vp.b)S._vp.b.textContent='▶';if(S._vp.f)S._vp.f.style.width='0%';}var a=new Audio(url);S._vp={id:id,a:a,b:b,f:f,t:t};a.ontimeupdate=function(){var dd=(isFinite(a.duration)&&a.duration>0)?a.duration:0;if(f&&dd)f.style.width=(a.currentTime/dd*100)+'%';if(t&&dd)t.textContent=fmtDur(a.duration-a.currentTime);};a.onended=function(){if(b)b.textContent='▶';if(f)f.style.width='0%';S._vp=null;};a.play().then(function(){if(b)b.textContent='⏸';}).catch(function(){toast('Lecture impossible');});},
  assignTo:function(id){S.sel.holder=id;S.route='attribuer';render();window.scrollTo(0,0);},
  createUser:async function(){var f=S.nu;var b=document.getElementById('btnCreate');if(!f.email||!f.pw){toast('Email et mot de passe requis');return;}if(f.role==='commercial'&&!f.mgr){toast('Choisissez le responsable de ce commercial');return;}if(b){b.textContent='Création…';b.disabled=true;}
    var r=await sb.rpc('admin_create_user',{p_email:f.email,p_password:f.pw,p_name:f.name||null,p_role:f.role||'commercial',p_mgr:f.mgr||null});
    if(r.error){toast('⚠ '+(r.error.message||r.error));if(b){b.textContent='Créer le compte';b.disabled=false;}return;}

    toast('Compte créé ✅');S.nu={role:'commercial'};S.showCreate=false;await refresh();},
  clearCred:function(){S.created=null;render();},
  shareCred:async function(){var c=S.created;if(!c)return;var msg=credMsg(c);try{if(navigator.share){await navigator.share({title:'Accès ZKA',text:msg});}else{window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');}}catch(e){}},
  copyCred:async function(){var c=S.created;if(!c)return;var msg=credMsg(c);try{await navigator.clipboard.writeText(msg);toast('Identifiants copiés ✅');}catch(e){try{window.prompt('Copiez ce message :',msg);}catch(e2){}}},
  setRole:async function(id,r){var res=await sb.rpc('admin_set_role',{p_target:id,p_role:r});if(res.error){toastErr(res.error);return;}toast('Poste mis à jour');await refresh();},
  setMgr:async function(id,m){var res=await sb.rpc('admin_set_mgr',{p_target:id,p_mgr:m||null});if(res.error){toastErr(res.error);return;}toast('Rattachement mis à jour');await refresh();},
  setShare:async function(id,v){var res=await sb.rpc('admin_set_share',{p_target:id,p_own:parseFloat(v)||0});if(res.error){toastErr(res.error);return;}toast('Part mise à jour');await refresh();},
  setComm:async function(id,c){var res=await sb.rpc('admin_set_comm',{p_target:id,p_comm:c});if(res.error){toastErr(res.error);return;}toast('Commission mise à jour');await refresh();},
  setTeamComm:async function(id,c){var res=await sb.rpc('admin_set_team_comm',{p_target:id,p_rate:c});if(res.error){toastErr(res.error);return;}toast('Prime d\'équipe mise à jour');await refresh();},
  setSalary:async function(id,v){var res=await sb.rpc('admin_set_salary',{p_target:id,p_salary:parseFloat(v)||0});if(res.error){toastErr(res.error);return;}toast('Salaire mis à jour');await refresh();},
  requestPayout:async function(kind,amount){var res=await sb.rpc('request_payout',{p_kind:kind,p_amount:amount});if(res.error){toastErr(res.error);return;}toast('Demande envoyée à la direction ✅');await refresh();},
  payMonth:async function(id,kind){var m=profById(id),mk=S.payMonth||curMonth();var amt=kind==='commission'?dueComm(m,mk):dueSalary(m,mk);if(amt<=0){toast('Rien à verser ce mois');return;}if(!window.confirm('Verser '+(kind==='commission'?'la commission':'le salaire')+' de '+((m&&m.name)||'')+' pour '+monthLabel(mk)+' : '+money(amt)+' ?'))return;var res=await sb.rpc('pay_member_month',{p_member:id,p_kind:kind,p_period:mk});if(res.error){toastErr(res.error);return;}toast('Versement enregistré ✅');await refresh();},
  payAll:async function(id){var m=profById(id);if(!m)return;if(!isPresident()){toast('Réservé au président');return;}var rows=remunHistory(m),jobs=[],months={};rows.forEach(function(r){if(r.rC>0){jobs.push({mk:r.mk,kind:'commission'});months[r.mk]=1;}if(r.rS>0){jobs.push({mk:r.mk,kind:'salaire'});months[r.mk]=1;}});if(!jobs.length){toast('Rien à verser');return;}var total=totalDueAll(m);if(!window.confirm('Verser TOUT le cumul dû à '+m.name+' ?\n'+Object.keys(months).length+' mois • total '+money(total)))return;toast('Versements en cours…');var done=0;for(var i=0;i<jobs.length;i++){var j=jobs[i];var res=await sb.rpc('pay_member_month',{p_member:id,p_kind:j.kind,p_period:j.mk});if(res.error){if(/déjà réglé/i.test(res.error.message||'')){continue;}toastErr(res.error);await refresh();return;}done++;}await refresh();toast(done>0?('Cumul versé ✅ ('+done+' versement'+(done>1?'s':'')+')'):'Déjà à jour');},
  setPayMonth:function(mk){S.payMonth=mk;render();},
  setBulMonth:function(mk){S.bulMonth=mk;render();window.scrollTo(0,0);},

  prof:function(k,v){(S.prof||(S.prof={}))[k]=v;},
  saveProfil:async function(){var f=S.prof||{};var res=await sb.rpc('update_my_profile',{p_name:(f.name!=null?f.name:S.me.name),p_emoji:null,p_phone:(f.phone!=null?f.phone:(S.me.phone||''))});if(res.error){toastErr(res.error);return;}S.prof={};var u=(await sb.auth.getUser()).data.user;var pr=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(pr.data)S.me=pr.data;toast('Profil enregistré ✅');await refresh();},
  changePassword:async function(){var f=S.prof||{};if(!f.pw||f.pw.length<6){toast('Mot de passe : au moins 6 caractères');return;}var res=await sb.auth.updateUser({password:f.pw});if(res.error){toastErr(res.error);return;}f.pw='';toast('Mot de passe mis à jour ✅');render();}
};

/* ---------- Gestes : glisser à gauche / à droite ---------- */
function swipeBackTarget(){
  var b={produit:role()==='boss'?'entrepot':'stock',produitNew:'entrepot',reception:'entrepot',terrain:'accueil',profil:'accueil',recu:role()==='commercial'?'ventes':'accueil',membre:'equipe',bulletin:(S.sel.bid===(S.me&&S.me.id)?'profil':(role()==='commercial'?'accueil':'membre')),creances:'accueil',demandes:'accueil',dm:'chat'};
  return b[S.route]||null;
}
function onSwipe(dir){
  if(!S.me)return;
  var tabs=tabsFor().map(function(t){return t[0];}),idx=tabs.indexOf(S.route);
  if(idx>=0){var ni=dir==='left'?idx+1:idx-1;if(ni<0||ni>=tabs.length)return;S.route=tabs[ni];render();window.scrollTo(0,0);}
  else if(dir==='right'){var to=swipeBackTarget();if(to){S.route=to;render();window.scrollTo(0,0);}}
}
(function(){
  var x0=null,y0=null,t0=0,ig=false,mode=null,row=null,fg=null,maxSw=0,wasOpen=false;
  function closeAll(except){var els=app.querySelectorAll('.swipe.open');for(var i=0;i<els.length;i++){if(els[i]===except)continue;els[i].classList.remove('open');var f=els[i].querySelector('.swipe-fg');if(f)f.style.transform='';}}
  app.addEventListener('touchstart',function(e){
    if(!e.touches||e.touches.length!==1){x0=null;return;}
    var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();mode=null;row=null;fg=null;wasOpen=false;
    var el=e.target;
    ig=!!(el&&el.closest&&el.closest('.chips,input,select,textarea,.stepper,.sa-btn,.rbtn'));
    var sw=el&&el.closest?el.closest('.swipe'):null;
    closeAll(sw);
    if(sw&&!ig){row=sw;fg=sw.querySelector('.swipe-fg');var acts=sw.querySelector('.swipe-actions');maxSw=acts?acts.offsetWidth:0;wasOpen=sw.classList.contains('open');}
  },{passive:true});
  app.addEventListener('touchmove',function(e){
    if(x0==null||ig)return;
    var t=e.touches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(mode==null){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){mode='h';}else if(Math.abs(dy)>8){mode='v';}}
    if(mode==='h'&&row&&fg){var base=wasOpen?-maxSw:0,tx=Math.max(-maxSw,Math.min(0,base+dx));fg.style.transform='translateX('+tx+'px)';}
  },{passive:true});
  app.addEventListener('touchend',function(e){
    if(x0==null||ig){x0=null;return;}
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0,dt=Date.now()-t0,r=row,f=fg,ms=maxSw,wo=wasOpen,md=mode;x0=null;row=null;fg=null;
    if(r&&f&&md==='h'){
      var final=(wo?-ms:0)+dx;
      if(final<-ms*0.4){f.style.transform='translateX('+(-ms)+'px)';r.classList.add('open');}
      else{f.style.transform='';r.classList.remove('open');}
      return;
    }
    if(md==='v')return;
    if(dt>600||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.8)return;
    onSwipe(dx<0?'left':'right');
  },{passive:true});
})();

else if(!window.supabase||!window.supabase.createClient){ app.innerHTML='<div class="content"><div class="card"><span class="badge dg">Hors ligne</span><div class="sm mut">La librairie Supabase n\'a pas pu être chargée (connexion internet ?).</div></div></div>'; }
else{ sb=window.supabase.createClient(cfg.url,cfg.anonKey); if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});} sb.auth.getSession().then(function(res){ if(res.data&&res.data.session)afterLogin(); else renderLogin(); }); }
})();
