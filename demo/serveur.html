<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5A4BE0">
<title>ZKA — Connexion au serveur partagé</title>
<style>
  :root{--violet:#5A4BE0;--bg:#0f1017;--surface:#15171f;--border:#262a38;--text:#f3f4fa;--t2:#a7acc2;--faint:#6b7189;--ok:#2ec97d;--okS:#0f2a1e;--warn:#fdb022;--warnS:#2c2110;--danger:#f97066;--dangerS:#2c1614;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text)}
  #app{max-width:460px;margin:0 auto;min-height:100dvh;padding:18px}
  .grad{background:linear-gradient(140deg,#6d5bf0,#8b5cf6 60%,#a855f7);border-radius:20px;padding:22px;color:#fff;margin-bottom:16px}
  .h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .sm{font-size:13px;color:var(--t2)}.cap{font-size:11px;color:var(--faint)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin:0 0 6px}
  input{width:100%;background:#0e0f16;border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;padding:13px 14px;outline:none}
  input:focus{border-color:var(--violet)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:700;font-size:15px;padding:13px 16px;width:100%;background:var(--violet);color:#fff}
  button.sec{background:#1c1e29;color:var(--text)}
  button:active{opacity:.85}
  .row{display:flex;gap:10px;align-items:center}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .ok{background:var(--okS);color:var(--ok)}.warn{background:var(--warnS);color:var(--warn)}.dg{background:var(--dangerS);color:var(--danger)}
  .lrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
  .lrow:first-child{border-top:none}
  code{background:#0e0f16;border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:12px}
  a{color:#b6a7ff}
  .mut{margin-top:8px}
</style>
</head>
<body>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div id="app"></div>
<script>
(function(){
  "use strict";
  var app = document.getElementById('app');
  var cfg = (window.ZKA_SUPABASE) || {};
  var sb = null, me = null, state = { products: [], holdings: [] };

  function esc(s){ return (''+ (s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function h(html){ app.innerHTML = html; }
  function header(sub){ return '<div class="grad"><div class="cap" style="opacity:.85">ZKA</div><div class="h1">Serveur partagé</div><div class="sm" style="color:#fff;opacity:.9;margin-top:4px">'+sub+'</div></div>'; }

  // --- Aucun réglage : montrer les instructions ---
  function showSetup(){
    h(header('Configuration requise')
      + '<div class="card"><b>Pas encore connecté à un serveur.</b>'
      + '<div class="sm mut">Pour partager les données entre les téléphones, renseignez vos 2 valeurs publiques Supabase dans le fichier <code>demo/config.js</code> :</div>'
      + '<div class="sm mut">1. Créez un projet gratuit sur <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>.</div>'
      + '<div class="sm mut">2. SQL Editor → collez <code>supabase/schema.sql</code> → Run.</div>'
      + '<div class="sm mut">3. Project Settings → API → copiez <code>Project URL</code> et la clé <code>anon public</code>.</div>'
      + '<div class="sm mut">4. Collez-les dans <code>demo/config.js</code> (ou envoyez-les moi).</div>'
      + '</div>'
      + '<div class="card"><div class="cap">Voir le guide complet : <code>supabase/README.md</code></div></div>');
  }

  function showError(msg){
    h(header('Erreur') + '<div class="card"><span class="badge dg">Problème</span><div class="sm mut">'+esc(msg)+'</div></div>');
  }

  // --- Écran de connexion (email + mot de passe) ---
  function showLogin(errMsg){
    h(header('Connectez-vous')
      + '<div class="card">'
      + (errMsg ? '<div class="badge dg" style="margin-bottom:10px">'+esc(errMsg)+'</div>' : '')
      + '<label>Email</label><input id="email" type="email" autocapitalize="off" placeholder="vous@exemple.com">'
      + '<label style="margin-top:12px">Mot de passe</label><input id="pw" type="password" placeholder="••••••••">'
      + '<button id="btnLogin" style="margin-top:16px">Se connecter</button>'
      + '<div class="cap mut">Les comptes sont créés par la direction dans Supabase → Authentication.</div>'
      + '</div>');
    document.getElementById('btnLogin').onclick = doLogin;
    document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  }

  async function doLogin(){
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('pw').value;
    var btn = document.getElementById('btnLogin'); btn.textContent = 'Connexion…'; btn.disabled = true;
    var res = await sb.auth.signInWithPassword({ email: email, password: pw });
    if (res.error){ showLogin(res.error.message || 'Identifiants incorrects'); return; }
    await afterLogin();
  }

  var diag = {};
  async function afterLogin(){
    var sess = await sb.auth.getSession();
    var user = (sess.data && sess.data.session) ? sess.data.session.user : null;
    if (!user){ var gu = await sb.auth.getUser(); user = gu.data ? gu.data.user : null; }
    diag.hasSession = !!(sess.data && sess.data.session);
    diag.email = user ? user.email : '(aucun)';
    diag.uid = user ? user.id : '(aucun)';
    var prof = await sb.from('profiles').select('*').eq('id', user ? user.id : '00000000-0000-0000-0000-000000000000').maybeSingle();
    diag.profErr = prof.error ? (prof.error.message || JSON.stringify(prof.error)) : null;
    diag.profFound = !!prof.data;
    me = prof.data || { name: (user && user.email) || 'Utilisateur', role: '—' };
    await syncAll();
    subscribeRealtime();
    render();
  }

  async function syncAll(){
    var p = await sb.from('products').select('*').order('name');
    var hd = await sb.from('holdings').select('*');
    diag.prodErr = p.error ? (p.error.message || JSON.stringify(p.error)) : null;
    diag.prodCount = (p.data || []).length;
    state.products = p.data || [];
    state.holdings = hd.data || [];
  }

  var channel = null;
  function subscribeRealtime(){
    if (channel) return;
    channel = sb.channel('zka-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, refresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'holdings' }, refresh)
      .subscribe();
  }
  var t = null;
  function refresh(){ clearTimeout(t); t = setTimeout(async function(){ await syncAll(); render(); }, 250); }

  function render(){
    var totalStock = state.products.reduce(function(s,p){ return s + (p.stock||0); }, 0);
    var held = {};
    state.holdings.forEach(function(x){ held[x.product_id] = (held[x.product_id]||0) + (x.qty||0); });
    var rows = state.products.map(function(p){
      return '<div class="lrow"><div><div>'+esc(p.name)+'</div><div class="cap">'+esc(p.cat)+' • détenu sur le terrain : '+(held[p.id]||0)+'</div></div>'
        + '<div style="text-align:right"><div>'+(p.stock||0)+' <span class="cap">entrepôt</span></div></div></div>';
    }).join('');
    h(header('Connecté — données en direct 🟢')
      + '<div class="card"><div class="row" style="justify-content:space-between"><div><b>'+esc(me.name)+'</b><div class="cap">Rôle : '+esc(me.role)+'</div></div><span class="badge ok">temps réel</span></div></div>'
      + '<div class="card"><div class="cap" style="margin-bottom:6px">Diagnostic</div>'
        + '<div class="lrow"><span>Session active</span><span class="badge '+(diag.hasSession?'ok':'dg')+'">'+(diag.hasSession?'oui':'non')+'</span></div>'
        + '<div class="lrow"><span>Email</span><span class="cap">'+esc(diag.email)+'</span></div>'
        + '<div class="lrow"><span>Profil trouvé</span><span class="badge '+(diag.profFound?'ok':'dg')+'">'+(diag.profFound?'oui':'NON')+'</span></div>'
        + (diag.profErr ? '<div class="lrow"><span>Erreur profil</span><span class="cap" style="color:var(--danger)">'+esc(diag.profErr)+'</span></div>' : '')
        + '<div class="lrow"><span>Produits lus</span><span class="badge '+(diag.prodCount>0?'ok':'warn')+'">'+(diag.prodCount!=null?diag.prodCount:'?')+'</span></div>'
        + (diag.prodErr ? '<div class="lrow"><span>Erreur produits</span><span class="cap" style="color:var(--danger)">'+esc(diag.prodErr)+'</span></div>' : '')
      + '</div>'
      + '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>Entrepôt central</b><span class="cap">'+state.products.length+' produits • '+totalStock+' u.</span></div>'
      + (rows || '<div class="sm">Aucun produit. '+(me.role==='boss'?'Ajoutez-en un ci-dessous.':'La direction doit en ajouter.')+'</div>')
      + '</div>'
      + (me.role === 'boss'
          ? '<div class="card"><label>Ajouter un produit de test (prouve l\'écriture + la synchro)</label><input id="pname" placeholder="Nom du produit"><div class="row mut"><input id="pstock" type="number" placeholder="Stock" style="flex:1"><button id="btnAdd" style="flex:1">Ajouter</button></div></div>'
          : '')
      + '<button class="sec" id="btnOut">Se déconnecter</button>');
    document.getElementById('btnOut').onclick = async function(){ await sb.auth.signOut(); me=null; showLogin(); };
    var add = document.getElementById('btnAdd');
    if (add) add.onclick = async function(){
      var name = document.getElementById('pname').value.trim();
      var stock = parseInt(document.getElementById('pstock').value, 10) || 0;
      if (!name) return;
      add.textContent = '…'; add.disabled = true;
      var r = await sb.from('products').insert({ name: name, cat: 'Test', price: 0, cost: 0, stock: stock, reorder: 5, unit: 'pièce', emoji: '🧪' });
      if (r.error) alert('Erreur : ' + r.error.message);
      await syncAll(); render();
    };
  }

  // --- Démarrage ---
  if (!cfg.url || !cfg.anonKey){ showSetup(); return; }
  if (!window.supabase || !window.supabase.createClient){ showError('La librairie Supabase n\'a pas pu être chargée (connexion internet ?).'); return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  sb.auth.getSession().then(function(res){
    if (res.data && res.data.session) afterLogin();
    else showLogin();
  });
})();
</script>
</body>
</html>
